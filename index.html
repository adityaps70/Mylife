<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya's Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--side:#0c0d10;--card:#111216;--card2:#17181d;--line:#1f2127;--line2:#2b2d34;
  --text:#f3f4ef;--muted:#8d8f96;--faint:#5f616a;
  --lime:#d7f64a;--lime-ink:#10120a;--lime-text:#d7f64a;--cyan:#45dfe6;--orange:#ff8a4c;--red:#ff4f6e;--yellow:#f5c84c;--violet:#a78bfa;--green:#6fe28a;
  --hl:rgba(255,255,255,.025);--shadow:0 20px 40px -20px rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f3f4ef;--side:#fbfbf8;--card:#ffffff;--card2:#f4f5f0;--line:#e5e6df;--line2:#d6d8d0;
  --text:#121316;--muted:#696b72;--faint:#9b9da3;
  --lime:#cdef2f;--lime-ink:#151708;--lime-text:#557000;--cyan:#0fa8b0;--orange:#e5682a;--red:#e0294d;--yellow:#c48f05;--violet:#7c5ce0;--green:#24984a;
  --hl:rgba(0,0,0,0);--shadow:0 10px 30px -18px rgba(0,0,0,.18);color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{
  --bg:#f3f4ef;--side:#fbfbf8;--card:#ffffff;--card2:#f4f5f0;--line:#e5e6df;--line2:#d6d8d0;
  --text:#121316;--muted:#696b72;--faint:#9b9da3;
  --lime:#cdef2f;--lime-ink:#151708;--lime-text:#557000;--cyan:#0fa8b0;--orange:#e5682a;--red:#e0294d;--yellow:#c48f05;--violet:#7c5ce0;--green:#24984a;
  --hl:rgba(0,0,0,0);--shadow:0 10px 30px -18px rgba(0,0,0,.18);color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--lime-text)}.neg{color:var(--red)}.warn{color:var(--yellow)}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:40;transition:width .2s,transform .25s}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 32px}
.logo b{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.logo .sp{flex:1}
.navsec{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:16px 12px 6px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:11px;color:var(--muted);font-weight:500;cursor:pointer;text-align:left;white-space:nowrap;position:relative}
.nav:hover{background:var(--card2);color:var(--text)}
.nav.on{background:var(--card2);color:var(--text)}
.nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--lime);box-shadow:0 0 12px var(--lime)}
.nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--lime);color:var(--lime-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.navscroll{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;cursor:pointer;width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--lime) 18%,var(--card2));color:var(--lime-text);border:1px solid color-mix(in srgb,var(--lime) 40%,transparent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 36px}
.me .t{min-width:0}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:12px;color:var(--muted);white-space:nowrap}
body.collapsed .side{width:76px}
body.collapsed .side .lbl,body.collapsed .navsec,body.collapsed .logo b,body.collapsed .me .t,body.collapsed .nav .badge{display:none}
body.collapsed .nav{justify-content:center}
body.collapsed .logo{flex-direction:column}
.app{margin-left:248px;min-height:100vh;transition:margin .2s}
body.collapsed .app{margin-left:76px}
.topbar{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:10px;padding:0 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.searchbtn{display:flex;align-items:center;gap:10px;width:min(380px,100%);height:42px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--faint);cursor:pointer;text-align:left}
.searchbtn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tsp{flex:1}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text);flex:0 0 42px}
.ibtn:hover{border-color:var(--line2)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.menuwrap{position:relative}
.pop{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);z-index:50;min-width:240px;padding:8px}
.pop.wide{width:min(380px,calc(100vw - 32px))}
.pop h4{font-size:13px;padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.mi:hover{background:var(--card2)}
.mi small{color:var(--muted);margin-left:auto}
.hamb{display:none}
main{padding:4px 28px 64px;max-width:1480px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 22px}
.phead .crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.phead h1{font-size:34px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.phead .sp{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.overlay{display:none}

/* ---------- components ---------- */
.card{background:linear-gradient(180deg,var(--hl),transparent 120px),var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch .sp{flex:1}
.ch h3{font-size:16px;font-weight:600}
.ch .sub{font-size:13px;color:var(--muted);margin-top:2px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.lime:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 10px;border-radius:9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.done{background:color-mix(in srgb,var(--lime) 14%,transparent);border-color:color-mix(in srgb,var(--lime) 45%,transparent);color:var(--lime-text)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line2))}
.link{border:0;background:none;color:var(--lime-text);font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.ic{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.ic:hover{background:var(--card2);color:var(--text)}
.ic svg.i{width:16px;height:16px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--card);border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button em{font-style:normal;font-size:11px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--card2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.pill.yellow{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 13%,transparent)}
.pill.lime{color:var(--lime-text);background:color-mix(in srgb,var(--lime) 13%,transparent)}
.pill.cyan{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--card2);color:var(--text);border-color:var(--line2)}
.gbar{position:relative;height:7px;border-radius:99px;background:var(--line);overflow:visible}
.gbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime))}
.gbar.over>i{background:linear-gradient(90deg,var(--orange),var(--red))}
.gbar.thick{height:12px}
.gbar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text);opacity:.7}
.segbar{display:flex;gap:4px;height:14px}
.segbar i{border-radius:4px;min-width:4px}
.leg{display:grid;gap:9px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.leg b{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.leg span{flex:1}
.leg em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px;border:1px solid}
.ico svg.i{width:17px;height:17px}
.ri{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ri:last-child{border-bottom:0}
.ri .rb{flex:1;min-width:0}
.ri .rt{font-weight:600;overflow-wrap:anywhere}
.ri .rs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ri .ra{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ri .ra small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.ri.paid .rt{color:var(--muted);text-decoration:line-through}
.ri.clickable{cursor:pointer}
.ri.clickable:hover .rt{color:var(--lime-text)}
.dateblk{width:42px;flex:0 0 42px;text-align:center;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:3px 0;font-size:10.5px;color:var(--muted);text-transform:uppercase;line-height:1.2}
.dateblk b{display:block;font-size:16px;color:var(--text)}
.soon{color:var(--yellow);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.trend svg.i{width:13px;height:13px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--lime) 30%,var(--line));background:color-mix(in srgb,var(--lime) 7%,var(--card));font-size:13.5px}
.banner.red{border-color:color-mix(in srgb,var(--red) 35%,var(--line));background:color-mix(in srgb,var(--red) 8%,var(--card))}
.banner .sp{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--faint);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--lime) 55%,transparent);outline-offset:0;border-color:transparent}
select{cursor:pointer}
.sel{width:auto;height:34px;padding:0 10px;font-size:13px;font-weight:600;border-radius:10px;background:var(--card)}
input.cell{width:110px;padding:6px 9px;text-align:right;font-variant-numeric:tabular-nums;background:transparent}
input.cell.ov{border-color:color-mix(in srgb,var(--lime) 60%,transparent);background:color-mix(in srgb,var(--lime) 8%,transparent)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline label{font-size:13px;color:var(--muted);font-weight:600}
.searchin{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:0 11px;height:38px;min-width:220px;flex:1;max-width:340px;color:var(--faint)}
.searchin input{border:0;background:none;padding:0;outline:0;height:100%}
.searchin input:focus{outline:0}

/* layout grids */
.stack{display:grid;gap:20px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.auto{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:0}
.hero .stats{border-left:1px solid var(--line);padding-left:20px;margin-left:20px;display:grid;gap:18px;align-content:start}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:8px;height:8px;border-radius:50%}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--faint);font-size:11px;font-family:inherit}
.gauge-wrap{position:relative;max-width:220px;margin:14px auto 0}
.gauge-wrap .gv{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.gauge-wrap .gv b{display:block;font-size:24px;font-weight:600}
.gauge-wrap .gv span{font-size:12px;color:var(--muted)}
.donutw{position:relative;flex:0 0 auto}
.donutw .dv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.donutw .dv b{font-size:22px;font-weight:600}
.donutw .dv span{font-size:12px;color:var(--muted);display:block}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 58px}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:13px}
.sq{display:grid;grid-template-columns:repeat(4,22px);gap:5px}
.sq i{width:22px;height:22px;border-radius:6px;background:var(--lime)}
.goalrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit}
.goalrow .gb{flex:1;min-width:0}
.goalrow .gt{display:flex;justify-content:space-between;gap:8px}
.goalrow .gt b{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.goalrow .gt span{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.goalrow .gt span small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.goalrow:hover .gt b{color:var(--lime-text)}
.glabel{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px}
.habit{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.tick{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.tick svg.i{width:13px;height:13px;stroke-width:3}
.tick.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.habit .hb{flex:1;min-width:0}
.habit .hn{font-weight:600;font-size:13.5px}
.habit.done .hn{color:var(--muted);text-decoration:line-through}
.habit .hd{font-size:12px;color:var(--muted)}
.streak{font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap}
.ms{display:flex;gap:9px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.ms .tick{flex-basis:18px;width:18px;height:18px;border-radius:5px}
.ms.done span{color:var(--muted);text-decoration:line-through}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.cat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cat .cb{flex:1;min-width:0}
.cat .ct{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat .ct b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ct .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .ct .amt small{color:var(--muted);font-weight:500}
.cat .cs{font-size:12px;color:var(--muted);margin-top:7px}
.cat:hover b{color:var(--lime-text)}
.dayhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.months{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.mon h4{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .dow{font-size:10px;color:var(--faint);text-align:center;padding:2px 0}
.day{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--text)}
.day:hover{background:var(--card2)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--lime);font-weight:700}
.day.sel{background:color-mix(in srgb,var(--lime) 16%,transparent)}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day.empty{visibility:hidden}
.logs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.logt{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.logt .lb{flex:1;min-width:0}
.logt label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.logt input{font-size:18px;font-weight:600;padding:6px 10px;background:var(--card)}
.water{display:flex;align-items:center;gap:8px}
.water b{font-size:18px;min-width:60px;text-align:center}
.paidcell{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;padding:0;color:transparent;display:grid;place-items:center;margin-left:auto}
.paidcell svg.i{width:12px;height:12px;stroke-width:3}
.paidcell.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.paidcell.late{border-color:var(--red)}
.season{display:flex;gap:12px}
.season ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.season ul li{margin:3px 0}
.tips{margin:0;padding-left:18px;font-size:13.5px}
.tips li{margin:6px 0}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:36px}

/* ================= motion ================= */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body::before{content:"";position:fixed;inset:-25vmax;pointer-events:none;z-index:0;background:radial-gradient(38vmax 28vmax at 18% 8%,color-mix(in srgb,var(--lime) 7%,transparent),transparent 70%),radial-gradient(34vmax 28vmax at 88% 35%,color-mix(in srgb,var(--cyan) 6%,transparent),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4vmax,3vmax,0) rotate(6deg)}}
.app{position:relative;z-index:1}
.anim .card,.anim .kpi,.anim .banner,.anim .phead,.anim .logt,.anim>.stack>.inline,.anim>.stack>.chips{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
.anim .phead h1 .w{display:inline-block;animation:wordUp .8s var(--spring) backwards;animation-delay:calc(var(--w)*80ms + 60ms)}
@keyframes wordUp{from{opacity:0;transform:translateY(55%) rotate(5deg)}}
.anim .gbar>i,.anim .segbar i{animation:grow 1.1s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms + .18s);transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}}
.anim svg.chart rect,.anim svg.bars rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .9s var(--ease) backwards;animation-delay:calc(var(--b,0)*28ms + .2s)}
@keyframes barUp{from{transform:scaleY(0)}}
.anim svg.chart path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim svg.chart circle{animation:fadeIn .4s 1.1s backwards}
.anim .donutw svg circle:nth-child(2),.anim .gauge-wrap svg path:nth-child(2){animation:dashIn 1.4s var(--ease) .2s backwards}
@keyframes dashIn{from{stroke-dasharray:0 100}}
.anim .ring{animation:ringIn 1.2s var(--ease) .15s backwards}
@keyframes ringIn{from{--p:0}}
@keyframes fadeIn{from{opacity:0}}
.anim-side .nav.on::before{animation:navIn .5s var(--spring)}
@keyframes navIn{from{transform:scaleY(0)}}
.anim-side .badge{animation:bump .5s var(--spring) .3s backwards}
.nav svg.i{transition:transform .3s var(--spring)}
.nav:hover svg.i{transform:scale(1.12) rotate(-6deg)}
.btn,.ibtn,.chip,.tick,.paidcell,.seg button,.ic,.mi,.day,.glass,.hc,.mood{transition:transform .18s var(--ease),background-color .2s,border-color .2s,color .2s,box-shadow .25s,opacity .2s}
.btn:active,.ibtn:active,.chip:active,.tick:active,.ic:active,.paidcell:active,.seg button:active,.day:active,.glass:active{transform:scale(.93)}
.btn.lime:hover{transform:translateY(-1px);box-shadow:0 8px 26px -8px color-mix(in srgb,var(--lime) 70%,transparent)}
.btn.open svg.i{animation:rot45 .35s var(--spring) forwards}
@keyframes rot45{to{transform:rotate(135deg)}}
.card{position:relative;transition:border-color .3s}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--lime) 8%,transparent),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover::after{opacity:1}
.card:hover{border-color:var(--line2)}
.kpi{transition:transform .3s var(--ease),border-color .3s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.ibtn .dot{animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 2px var(--card),0 0 0 2px color-mix(in srgb,var(--red) 70%,transparent)}70%,100%{box-shadow:0 0 0 2px var(--card),0 0 0 9px transparent}}
.pop{animation:popIn .26s var(--spring);transform-origin:top right}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.95)}}
.tick.bump,.btn.bump,.paidcell.bump{animation:bump .5s var(--spring)}
.tick.bump svg path,.paidcell.bump svg path,.btn.bump svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .35s .12s forwards}
@keyframes bump{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.habit.bump .hn{animation:flash .7s}
@keyframes flash{30%{color:var(--lime-text)}}
dialog[open]{animation:dlgIn .4s var(--spring)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
dialog.closing{animation:dlgOut .18s ease forwards}
dialog.closing::backdrop{animation:fadeOut .18s ease forwards}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fadeOut{to{opacity:0}}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;pointer-events:none;justify-items:center}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;font-size:13.5px;box-shadow:0 14px 40px -10px rgba(0,0,0,.55);animation:toastIn .45s var(--spring);white-space:nowrap}
.toast .tic{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.toast .tic svg.i{width:14px;height:14px;stroke-width:2.6}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.particle{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:95}
/* scry search */
.scry{position:relative;width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:21px;transition:width .55s var(--ease),border-radius .55s var(--ease),border-color .3s}
.scry.open{width:min(440px,calc(100vw - 600px));border-radius:13px;border-color:var(--line2)}
.scry input{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;padding:0 46px 0 16px;opacity:0;pointer-events:none;transition:opacity .2s;border-radius:inherit}
.scry.open input{opacity:1;pointer-events:auto;transition:opacity .3s .22s}
.scry input:focus{outline:0}
.scry-btn{position:absolute;top:0;left:0;width:40px;height:40px;border:0;background:none;color:var(--text);cursor:pointer;display:grid;place-items:center;border-radius:20px;transition:left .55s var(--ease)}
.scry.open .scry-btn{left:calc(100% - 40px)}
.scry-btn svg.i{grid-area:1/1;transition:transform .45s var(--spring),opacity .25s}
.scry-btn .sx{opacity:0;transform:rotate(-90deg) scale(.4)}
.scry.open .scry-btn .ss{opacity:0;transform:rotate(90deg) scale(.4)}
.scry.open .scry-btn .sx{opacity:1;transform:none}
.scry-res{left:0;right:auto;top:50px;width:100%;min-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;transform-origin:top left}
.scry-res .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
/* lumen theme reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.lumen svg.i{transition:transform .5s var(--spring)}
.lumen:hover svg.i{transform:rotate(30deg) scale(1.1)}
/* top pill (streak + year) */
.tpill{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tpill b{color:var(--text)}
.tpill .yr{width:18px;height:18px;border-radius:50%;flex:0 0 18px;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line2) 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
@media (max-width:1240px){.tpill{display:none}}
/* gulp delete */
.gulp{position:relative;transition:width .35s var(--ease),border-radius .35s,background-color .2s}
.gulp .bin{position:relative;width:16px;height:18px;display:inline-block;flex:0 0 16px}
.gulp .bin svg{position:absolute;inset:0;width:16px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.gulp .lid{transform-origin:1px 4.5px;transition:transform .28s var(--spring)}
.gulp.eating .lid{transform:rotate(-34deg) translateY(-1px)}
.gulp .gw{display:inline-flex}
.gulp .gw i{font-style:normal;display:inline-block}
.gulp.armed{background:color-mix(in srgb,var(--red) 14%,transparent);animation:armPulse 1s ease infinite}
@keyframes armPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 18%,transparent)}}
.gulp.loading{width:38px!important;padding:0;justify-content:center;border-radius:50%}
.gulp .spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--red) 30%,transparent);border-top-color:var(--red);animation:spin .6s linear infinite}
.gulp.loading .spin{display:block}.gulp.loading .bin,.gulp.loading .gw{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.delhint{font-size:12px;color:var(--red);align-self:center;animation:fadeIn .2s}
/* gyre unlock */
.gyre{position:relative;height:120px;display:none}
.lockcard.ok .gyre{display:block}
.lockcard.ok #lockpw,.lockcard.ok .cbx,.lockcard.ok #lockbtn,.lockcard.ok #lockerr,.lockcard.ok .lsub{display:none}
.gyre i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:10px;background:var(--lime);box-shadow:0 0 18px color-mix(in srgb,var(--lime) 50%,transparent);opacity:0}
.gyre .gok{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:19px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;opacity:0;box-shadow:0 0 40px color-mix(in srgb,var(--lime) 45%,transparent)}
.gyre .gok svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gyre .gok path{stroke-dasharray:30;stroke-dashoffset:30}
.lockcard{animation:rise .7s var(--spring)}
/* halvi-style dial, water glasses, hatched bars */
.dial{position:relative;width:210px;max-width:100%;margin:0 auto}
.dial svg{width:100%;display:block}
.dial line{stroke-width:5.5;stroke-linecap:round}
.anim .dial line.on{animation:tickIn .5s var(--ease) backwards;animation-delay:calc(var(--t)*18ms + .25s)}
@keyframes tickIn{from{stroke:var(--line)}}
.dial .dv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial .dn{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1}
.glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
.glass{height:46px;border-radius:11px;border:1px solid var(--line2);cursor:pointer;padding:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 7px);position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 85%,#fff),var(--cyan));transform:scaleY(0);transform-origin:bottom}
.glass.on{border-color:transparent}
.glass.on::after{transform:scaleY(1)}
.glass.fill::after{animation:fillUp .55s var(--spring) backwards;animation-delay:calc(var(--g)*70ms)}
@keyframes fillUp{from{transform:scaleY(0)}}
.glass:hover{border-color:var(--cyan)}
svg.bars{width:100%;height:auto;display:block}
svg.bars text{fill:var(--faint);font-size:11px;font-family:inherit}
/* cairnly-style streak, heatmap, cairn, journal */
.streakdots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.sd{width:15px;height:15px;border-radius:50%;background:var(--line)}
.sd.full{background:var(--lime)}.sd.half{background:color-mix(in srgb,var(--lime) 40%,var(--line))}
.sd.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--lime)}
.anim .sd{animation:bump .45s var(--spring) backwards;animation-delay:calc(var(--s)*30ms + .2s)}
.heat{display:grid;grid-template-columns:18px repeat(16,minmax(0,1fr));gap:5px;align-items:center}
.hc{aspect-ratio:1;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;width:100%;max-width:26px;justify-self:center}
.hc.l1{background:color-mix(in srgb,var(--lime) 30%,var(--line))}.hc.l2{background:color-mix(in srgb,var(--lime) 62%,var(--line))}.hc.l3{background:var(--lime)}
.hc.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.hc.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--text)}
.hc.sel{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--cyan)}
.hc:not(.fut):hover{transform:scale(1.2)}
.anim .hc{animation:bump .45s var(--spring) backwards;animation-delay:calc(var(--c)*32ms + .15s)}
.heat .dl,.hm-months span{font-size:10.5px;color:var(--faint)}
.hm-months{display:grid;grid-template-columns:18px repeat(16,minmax(0,1fr));gap:5px;margin-top:6px;white-space:nowrap}
.hm-legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hm-legend span{display:inline-flex;gap:5px;align-items:center}
.hm-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cairn{display:block;margin:4px auto 0;overflow:visible}
.cairn .st.new{animation:drop .75s var(--spring) backwards;animation-delay:calc(var(--s)*110ms + .15s)}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}}
.moods{display:flex;gap:9px;align-items:center}
.mood{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;padding:0;background:color-mix(in srgb,var(--lime) calc(var(--m)*19%),var(--line2))}
.mood.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--lime);transform:scale(1.12)}
textarea.jl{min-height:80px;resize:vertical}
/* motion off */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
html.nomotion *,html.nomotion *::before,html.nomotion *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));column-gap:36px}
.shelf .ri:last-child{border-bottom:1px solid var(--line)}
/* lock screen */
#lock{display:none}
body.locked .side,body.locked .app,body.locked .overlay{display:none!important}
body.locked #lock{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(600px 400px at 50% 20%,color-mix(in srgb,var(--lime) 9%,transparent),transparent),var(--bg)}
.lockcard{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px;display:grid;gap:14px;text-align:center;box-shadow:var(--shadow)}
.lockcard .mk{width:52px;height:52px;border-radius:16px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin:0 auto 4px}
.lockcard .mk svg.i{width:24px;height:24px}
.lockcard h2{font-size:24px;font-weight:600;letter-spacing:-.02em}
.lockcard input[type=password]{height:48px;font-size:16px;text-align:center;letter-spacing:.08em}
.lockcard .cbx{justify-content:center;font-size:13px;color:var(--muted)}
.lockcard .btn{height:46px;justify-content:center;font-size:14px}
#lockerr{color:var(--red);font-size:13px;min-height:18px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* dialogs */
dialog{border:1px solid var(--line2);border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
dialog form{padding:22px}
dialog h3{font-size:19px;font-weight:600;margin-bottom:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide,.cbx{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld small{font-size:12px;color:var(--faint)}
.cbx{display:flex;gap:9px;align-items:center;font-size:14px}
.cbx input{width:auto;accent-color:var(--lime)}
.dlg-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
#search{width:min(600px,calc(100vw - 24px));top:10vh;margin-top:0}
#search .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--faint)}
#search .sh input{border:0;background:none;padding:0;font-size:16px}
#search .sh input:focus{outline:0}
#search .res{max-height:55vh;overflow-y:auto;padding:8px}
#search .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}

/* responsive */
@media (max-width:1240px){.ov{grid-template-columns:1fr}.ov>.aside{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px}}
@media (max-width:1000px){.r3{grid-template-columns:1fr 1fr}.r3>:last-child{grid-column:1/-1}}
@media (max-width:860px){
  .side{transform:translateX(-100%);width:268px!important;box-shadow:var(--shadow)}
  body.navopen .side{transform:none}
  body.navopen .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  body.collapsed .side .lbl,body.collapsed .navsec,body.collapsed .logo b,body.collapsed .me .t,body.collapsed .nav .badge{display:revert}
  body.collapsed .nav{justify-content:flex-start}
  .app,body.collapsed .app{margin-left:0}
  .hamb{display:grid}
  .collapse-btn{display:none}
  .topbar{padding:0 16px;height:62px}
  .searchbtn span,.searchbtn .kbd{display:none}
  .searchbtn{width:42px;padding:0;justify-content:center;flex:0 0 42px}
  .newlbl{display:none}
  main{padding:0 16px 56px}
  .phead h1{font-size:28px}
  .r2,.r3,.catgrid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .stats{border-left:0;margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stat .v{font-size:18px}
  .big{font-size:28px}
  .fields{grid-template-columns:1fr}
  .scry.open{position:absolute;left:16px;right:16px;top:10px;width:auto;z-index:5}
}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi .v{font-size:18px}.hero .stats{grid-template-columns:1fr 1fr}}
</style>

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const center=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};

function toast(msg,icn='tick'){const box=$('#toasts');const t=document.createElement('div');t.className='toast';t.innerHTML=`<span class="tic">${ic(icn)}</span>${esc(msg)}`;box.appendChild(t);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2400)}
function burst(x,y,n=22,colors=['var(--lime)','var(--cyan)','var(--orange)','var(--violet)','var(--yellow)']){
  if(RM())return;
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=colors[i%colors.length];if(i%3===0)p.style.borderRadius='50%';document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=36+Math.random()*95,dx=Math.cos(a)*d,dy=Math.sin(a)*d-35;
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+70}px)) rotate(${Math.random()*600-300}deg) scale(.35)`,opacity:0}],{duration:700+Math.random()*550,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}
}
function closeDlg(d){if(!d.open)return;if(RM()){d.close();return}d.classList.add('closing');setTimeout(()=>{d.classList.remove('closing');d.close()},180)}
function countUp(root){
  root.querySelectorAll('.big,.mid,.kpi .v,.stat .v,.gauge-wrap .gv b,.donutw .dv b,.dial .dn').forEach(el=>{
    const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let n;while((n=tw.nextNode()))nodes.push(n);
    nodes.forEach(t=>{const txt=t.nodeValue;
      if(!/₹/.test(txt)&&!/^\s*[−+]?[\d,]+(\.\d+)?\s*(%|h|kg|days?|months?)?\s*$/.test(txt))return;
      const m=txt.match(/^([^\d]*?)(\d[\d,]*(?:\.\d+)?)([\s\S]*)$/);if(!m)return;
      const target=parseFloat(m[2].replace(/,/g,''));if(!isFinite(target)||target===0)return;
      const dec=(m[2].split('.')[1]||'').length,grp=m[2].includes(',')||target>=1000&&/₹/.test(txt),t0=performance.now(),D=950;
      const step=now=>{const k=Math.min(1,(now-t0)/D),v=target*(1-Math.pow(1-k,3));
        const s=grp?v.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec}):v.toFixed(dec);
        t.nodeValue=m[1]+s+m[3];if(k<1)requestAnimationFrame(step);else t.nodeValue=txt};
      t.nodeValue=m[1]+'0'+m[3];requestAnimationFrame(step)})});
}

/* Gulp-style delete: the bin eats the word, button becomes a loader, then a burst */
async function gulp(b){
  const bin=b.querySelector('.bin'),letters=[...b.querySelectorAll('.gw i')];b.classList.add('eating');
  const [bx,by]=center(bin);
  await Promise.all(letters.map((l,i)=>{const [lx,ly]=center(l),dx=bx-lx,dy=by-ly;
    return l.animate([{transform:'none',opacity:1},{transform:`translate(${dx*.55}px,${dy-18}px) rotate(-25deg) scale(.85)`,opacity:1,offset:.55},{transform:`translate(${dx}px,${dy+3}px) rotate(-70deg) scale(.15)`,opacity:0}],{duration:440,delay:i*85,easing:'cubic-bezier(.5,0,.6,1)',fill:'forwards'}).finished
      .then(()=>bin.animate([{transform:'scale(1)'},{transform:'scale(1.25,.82)'},{transform:'scale(1)'}],{duration:190,easing:'ease-out'}).finished)}));
  b.classList.remove('eating');await wait(170);
  b.style.width=b.offsetWidth+'px';void b.offsetWidth;b.classList.add('loading');await wait(700);
  const [cx,cy]=center(b);burst(cx,cy,18,['var(--red)','var(--orange)','var(--yellow)']);await wait(160);
}

/* ================= finance math ================= */
const billMonthly=b=>num(b.amount)/(STEP[b.freq]||1);
function billDueIn(b,y,m){const st=STEP[b.freq]||1;if(st===1)return true;return (((m-num(b.startMonth))%st)+st)%st===0}
function loanSim(l){
  let b=num(l.outstanding);const r=num(l.rate)/1200,e=num(l.emi);let n=0,int=0;
  if(b<=0)return {n:0,int:0};if(e<=0||e<=b*r)return {n:Infinity,int:Infinity};
  while(b>0.5&&n<600){const i=b*r;int+=i;b=b+i-Math.min(e,b+i);n++}
  return {n,int};
}
function simulate(extra,strategy,rollover){
  const ls=state.loans.filter(l=>num(l.outstanding)>0&&num(l.emi)>0).map(l=>({id:l.id,name:l.name,b:num(l.outstanding),r:num(l.rate)/1200,emi:num(l.emi),done:0}));
  if(!ls.length)return {months:0,interest:0,order:[],stuck:false};
  let m=0,interest=0;const order=[];
  while(ls.some(l=>l.b>0.5)&&m<600){
    m++;let pool=extra;
    for(const l of ls){
      if(l.b<=0.5){if(rollover)pool+=l.emi;continue}
      const i=l.b*l.r;interest+=i;l.b+=i;const pay=Math.min(l.emi,l.b);l.b-=pay;
      if(rollover&&pay<l.emi)pool+=l.emi-pay;
      if(l.b<=0.5&&!l.done){l.done=m;order.push(l)}
    }
    while(pool>0.5){
      const open=ls.filter(l=>l.b>0.5);if(!open.length)break;
      open.sort(strategy==='snowball'?(a,b)=>a.b-b.b:(a,b)=>b.r-a.r);
      const t=open[0],p=Math.min(pool,t.b);t.b-=p;pool-=p;
      if(t.b<=0.5&&!t.done){t.done=m;order.push(t)}
    }
  }
  return {months:m,interest,order,stuck:m>=600};
}
const txIn=(y,m)=>state.tx.filter(t=>t.date&&pd(t.date).getFullYear()===y&&pd(t.date).getMonth()===m);
const txOut=(y,m)=>sum(txIn(y,m).filter(t=>t.dir!=='in'),t=>t.amount);
const txInc=(y,m)=>sum(txIn(y,m).filter(t=>t.dir==='in'),t=>t.amount);
function fin(){
  const income=sum(state.income,x=>x.amount),bills=sum(state.bills,billMonthly);
  const active=state.loans.filter(l=>num(l.outstanding)>0);
  const emi=sum(active,l=>l.emi),spend=sum(state.expenses,x=>x.amount);
  const out=bills+emi+spend,left=income-out,debt=sum(active,l=>l.outstanding);
  const assets=sum(state.savings,s=>s.current);
  const ef=sum(state.savings.filter(s=>s.type==='Emergency fund'),s=>s.current);
  const needs=bills+emi+sum(state.expenses.filter(e=>e.kind!=='want'),e=>e.amount);
  const wants=sum(state.expenses.filter(e=>e.kind==='want'),e=>e.amount);
  return {income,bills,emi,spend,out,left,rate:income?left/income:NaN,debt,assets,net:assets-debt,emiRatio:income?emi/income:NaN,ef,efMonths:out?ef/out:0,needs,wants};
}
function loanEmiInMonth(l,y,m){
  const e=num(l.emi);if(!e)return 0;
  const mEnd=new Date(y,m+1,0),t=today();
  if(l.startDate&&pd(l.startDate)>mEnd)return 0;
  const diff=(y-t.getFullYear())*12+(m-t.getMonth());
  if(diff<0)return e;
  return diff<loanSim(l).n?e:0;
}
function monthRow(y,m){
  const key=ym(y,m),o=state.months[key]||{};
  const bills=sum(state.bills.filter(b=>billDueIn(b,y,m)),b=>b.amount);
  const emi=sum(state.loans,l=>loanEmiInMonth(l,y,m));
  const ovI=o.income!==undefined&&o.income!=='',ovS=o.spent!==undefined&&o.spent!=='';
  const hasTx=txIn(y,m).some(t=>t.dir!=='in');
  const income=ovI?num(o.income):sum(state.income,x=>x.amount)+txInc(y,m);
  const spend=ovS?num(o.spent):hasTx?txOut(y,m):sum(state.expenses,x=>x.amount);
  return {key,bills,emi,income,spend,out:bills+emi+spend,left:income-bills-emi-spend,ovI,ovS,actual:hasTx};
}

/* ================= reminders engine ================= */
function monthlyOcc(baseY,baseM,day,step,from,to,minDate){
  const out=[];let y=from.getFullYear(),m=from.getMonth();
  while(new Date(y,m,1)<=to){
    const diff=(y-baseY)*12+(m-baseM);
    if(((diff%step)+step)%step===0){const d=new Date(y,m,Math.min(day,dim(y,m)));if(d>=from&&d<=to&&(!minDate||d>=minDate))out.push(d)}
    if(++m>11){m=0;y++}
  }
  return out;
}
function eventsBetween(from,to){
  const ev=[],ty=today().getFullYear();
  for(const r of state.reminders){
    if(!r.date)continue;
    const b=pd(r.date);let dates=[];const rep=r.repeat||'none';
    if(rep==='none'){if(b>=from&&b<=to)dates=[b]}
    else if(rep==='weekly'){const k=Math.max(0,Math.ceil(daysBetween(b,from)/7));for(let d=addDays(b,k*7);d<=to;d=addDays(d,7))dates.push(d)}
    else dates=monthlyOcc(b.getFullYear(),b.getMonth(),b.getDate(),STEP[rep]||12,from,to,b);
    for(const d of dates){
      let extra='';
      if(rep==='yearly'&&(r.type==='Birthday'||r.type==='Anniversary')&&b.getFullYear()<=ty-2){const n=d.getFullYear()-b.getFullYear();extra=r.type==='Birthday'?`turns ${n}`:`${n} years`}
      ev.push({date:d,title:r.title,type:r.type||'Other',amount:num(r.amount),src:'reminder',id:r.id,notes:r.notes,extra,lead:num(r.lead)});
    }
  }
  for(const b of state.bills){
    const st=STEP[b.freq]||1;
    for(const d of monthlyOcc(2000,st===1?0:num(b.startMonth),num(b.dueDay)||1,st,from,to,null))
      ev.push({date:d,title:b.name,type:'Bill/Payment',amount:num(b.amount),src:'bill',id:b.id,notes:b.notes,extra:b.autopay?'autopay':'',lead:2});
  }
  const t=today();
  for(const l of state.loans){
    if(num(l.outstanding)<=0||num(l.emi)<=0)continue;
    const n=loanSim(l).n,start=l.startDate?pd(l.startDate):null;
    for(const d of monthlyOcc(2000,0,num(l.dueDay)||1,1,from,to,start)){
      const diff=(d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth());
      if(diff>=0&&isFinite(n)&&diff>=n)continue;
      ev.push({date:d,title:l.name+' EMI',type:'EMI',amount:num(l.emi),src:'loan',id:l.id,notes:l.lender,extra:'',lead:2});
    }
  }
  return ev.sort((a,b)=>a.date-b.date||a.title.localeCompare(b.title));
}
const paidKey=e=>e.src==='bill'?`B:${e.id}|${ym(e.date.getFullYear(),e.date.getMonth())}`:e.src==='loan'?`L:${e.id}|${ym(e.date.getFullYear(),e.date.getMonth())}`:null;
function lateThisMonth(){const t=today();return eventsBetween(new Date(t.getFullYear(),t.getMonth(),1),addDays(t,-1)).filter(e=>(e.src==='bill'||e.src==='loan')&&num(e.amount)>0&&!state.paid[paidKey(e)])}
function evRow(e){

  return `<div class="ri ${paid?'paid':''}"><span class="dateblk"><b>${e.date.getDate()}</b>${MONTHS[e.date.getMonth()]}</span>
  <div class="rb"><div class="rt">${esc(e.title)}${e.extra?` <span class="muted small" style="font-weight:500">· ${esc(e.extra)}</span>`:''}</div>
  <div class="rs">${typeTag(e.type)}${e.amount?`<span>· ${inr(e.amount)}</span>`:''}<span>·</span><span class="${dd>=0&&dd<=3?'soon':''}">${when}</span></div></div>${btn}</div>`;
}
function togglePaid(pk){
  if(pk.startsWith('L:')){
    const [lid]=pk.slice(2).split('|'),l=state.loans.find(x=>x.id===lid);
    if(state.paid[pk]){if(l&&state.paid[pk].prev!==undefined)l.outstanding=state.paid[pk].prev;delete state.paid[pk]}
    else if(l){const prev=num(l.outstanding),r=num(l.rate)/1200;l.outstanding=Math.max(0,Math.round(prev+prev*r-num(l.emi)));state.paid[pk]={prev}}
  }else{if(state.paid[pk])delete state.paid[pk];else state.paid[pk]=true}

/* ================= habits & goals ================= */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return `${y}-W${pad(Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7))}`}
function periodKey(p,d=today()){switch(p){case'daily':return'd:'+ds(d);case'weekly':return'w:'+isoWeek(d);case'monthly':return'm:'+ym(d.getFullYear(),d.getMonth());case'quarterly':return`q:${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;default:return'y:'+d.getFullYear()}}
const isDone=(h,d=today())=>!!(state.health.checks[periodKey(h.period,d)]||{})[h.id];
function setDone(h,v,d=today()){const k=periodKey(h.period,d);const c=state.health.checks[k]=state.health.checks[k]||{};if(v)c[h.id]=true;else delete c[h.id]}
function streak(h){let n=0,d=today();if(!isDone(h,d))d=addDays(d,-1);while(isDone(h,d)&&n<3650){n++;d=addDays(d,-1)}return n}
function autoHabits(){
  const log=state.health.logs[ds(today())]||{};
  for(const h of state.health.habits){
    if(h.auto==='steps'&&num(log.steps)>=10000)setDone(h,true);
    if(h.auto==='water'&&num(log.water)>=12)setDone(h,true);
    if(h.auto==='sleep'&&num(log.sleep)>=7)setDone(h,true);
  }
}
function goalProg(g){
  let cur=num(g.current),tgt=num(g.target);
  if(g.link==='debt'){const P=sum(state.loans,l=>Math.max(num(l.principal),num(l.outstanding)));cur=P-sum(state.loans,l=>l.outstanding);tgt=P}
  else if(g.link==='emergency'){const f=fin();cur=f.ef;tgt=tgt||Math.round(f.out*6)}
  else if(g.link==='savings'){cur=sum(state.savings,s=>s.current)}
  const p=tgt>0?Math.max(0,Math.min(1,cur/tgt)):(g.milestones?.length?g.milestones.filter(m=>m.done).length/g.milestones.length:0);
  return {cur,tgt,p,money:g.unit==='₹'||!!g.link};
}
const gfmt=(g,p,v)=>p.money?kfmt(v):`${Math.round(v*100)/100}${g.unit?' '+esc(g.unit):''}`;
function timeLeft(dl){if(!dl)return '';const d=daysBetween(today(),pd(dl));if(d<0)return 'overdue';if(d<45)return d+' days to go';const m=Math.round(d/30.4);return m<24?m+' months to go':Math.round(m/12)+' years to go'}

function nice(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(labels,series,mode,H=230){
  const W=640,pl=46,pr=6,pt=8,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const all=series.flatMap(s=>s.values);let mx=Math.max(1,...all),mn=Math.min(0,...all);
  const st=nice((mx-mn)/4);mx=Math.ceil(mx/st)*st;mn=Math.floor(mn/st)*st;if(mx===mn)mx=mn+st;
  const y=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g='';for(let v=mn;v<=mx+1e-6;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v===0?'0':kfmt(v).replace('₹','')}</text>`;
  const n=labels.length,bw=iw/n;let body='';
  if(mode==='line'){
    for(const s of series){const pts=s.values.map((v,i)=>[pl+bw*i+bw/2,y(v)]);
      body+=`<path class="ln" pathLength="1" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" style="fill:none;stroke:${s.color};stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--card);stroke:${s.color};stroke-width:2"><title>${labels[i]} · ${s.name}: ${inr(s.values[i])}</title></circle>`).join('');}
  }else{
    const gw=Math.min(bw*.72,90),k=series.length,w=Math.max(3,gw/k-3);
    labels.forEach((_,i)=>series.forEach((s,j)=>{const v=s.values[i],x=pl+bw*i+(bw-gw)/2+j*(gw/k)+1.5,y0=y(Math.max(v,0)),h=Math.max(Math.abs(y(v)-y(0)),v?2:0);
      body+=`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2)}" style="fill:${s.color}"><title>${labels[i]} · ${s.name}: ${inr(v)}</title></rect>`}));
  }
  const lb=labels.map((l,i)=>`<text x="${pl+bw*i+bw/2}" y="${H-6}" text-anchor="middle">${l}</text>`).join('');
  return `<svg class="chart" data-k="${series.length}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line2)"/>${body}${lb}</svg>`;
}
function gauge(p){const v=Math.max(0,Math.min(1,p||0));return `<svg viewBox="0 0 200 112" style="width:100%;display:block"><path d="M18 100A82 82 0 0 1 182 100" pathLength="100" style="fill:none;stroke:var(--line);stroke-width:18;stroke-linecap:round"/><path d="M18 100A82 82 0 0 1 182 100" pathLength="100" stroke-dasharray="${v*100} 100" style="fill:none;stroke:url(#gH);stroke-width:18;stroke-linecap:round"/></svg>`}
function donut(p,size,label,sub){const v=Math.max(0,Math.min(1,p||0));return `<div class="donutw" style="width:${size}px;height:${size}px"><svg viewBox="0 0 120 120" width="${size}" height="${size}"><circle cx="60" cy="60" r="50" style="fill:none;stroke:var(--line);stroke-width:11"/><circle cx="60" cy="60" r="50" pathLength="100" transform="rotate(-90 60 60)" stroke-dasharray="${v*100} 100" style="fill:none;stroke:${p>1?'var(--red)':'url(#gH)'};stroke-width:11;stroke-linecap:round"/></svg><div class="dv"><div><b>${label}</b><span>${sub}</span></div></div></div>`}
const gbar=(p,over,tick)=>`<div class="gbar ${over?'over':''}"><i style="width:${Math.max(0,Math.min(1,p))*100}%"></i>${tick!=null?`<span class="tick" style="left:calc(${Math.max(0,Math.min(1,tick))*100}% - 1px)"></span>`:''}</div>`;
function trend(cur,prev,goodUp=true){if(!prev)return '<span class="tiny faint">no data last month</span>';const ch=(cur-prev)/Math.abs(prev);const up=ch>=0;const good=up===goodUp;return `<span class="trend" style="color:${good?'var(--lime-text)':'var(--red)'}">${ic(up?'up':'down')}${Math.abs(ch*100).toFixed(1)}%</span> <span class="tiny muted">vs last month</span>`}

    <div class="seg">${[['used','% used'],['left','Left'],['az','A–Z']].map(([v,l])=>`<button class="${ui.bSort===v?'on':''}" data-set="bSort:${v}">${l}</button>`).join('')}</div></div>
    <div class="catgrid">${list.map(r=>{const s=st(r);return `<div class="cat" data-edit="expenses" data-id="${r.e.id}">${icoBox(catIcon(r.e.name),pcol(r.e.name))}<div class="cb"><div class="ct"><b>${esc(r.e.name)}</b>${pill(s)}<span class="amt">${inr(r.s)} <small>of ${inr(r.cap)}</small></span></div>${gbar(r.u,r.u>1,r.cap?dayP:null)}<div class="cs">${r.cap?(r.s<=r.cap?`${inr(r.cap-r.s)} left · ${pct(r.u)} used`:`<span class="neg">${inr(r.s-r.cap)} over</span> · ${pct(r.u)} used`):'No cap set'} · ${r.e.kind==='want'?'Want':'Need'}</div></div></div>`}).join('')||'<div class="empty">Nothing in this filter.</div>'}</div></div>

function pDebt(){

    <div class="inline" style="justify-content:space-between;margin-bottom:8px"><span class="mid">${inr(num(l.outstanding))}</span><span class="small muted">left of ${inr(pr)} · ${pct(pp)} repaid</span></div>${gbar(pp)}
    <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">
      ${[['Rate',r+'%'],['EMI',inr(num(l.emi))],['Months left',isFinite(s.n)?s.n:'∞'],['Payoff',isFinite(s.n)?dfd(s.n):'Never'],['Interest left',isFinite(s.int)?`<span class="neg">${inr(s.int)}</span>`:'—']].map(([a,b])=>`<div><div class="tiny muted">${a}</div><b>${b}</b></div>`).join('')}</div>

    <div class="inline" style="margin-top:14px">${num(l.outstanding)>0?`<button class="btn sm ${paid?'done':''} ${justId===pk?'bump':''}" data-paid="${pk}">${paid?ic('tick')+` ${MONTHS[t.getMonth()]} EMI paid`:`Mark ${MONTHS[t.getMonth()]} EMI paid`}</button><button class="btn sm ghost" data-prepay="${l.id}">Record prepayment</button>`:'<span class="pill lime">Closed 🎉</span>'}</div></div>`}).join('');

    <div style="flex:1;min-width:240px"><div class="tiny faint" style="letter-spacing:.08em;text-transform:uppercase;font-weight:600">Total outstanding</div><div class="big">${inr(f.debt)}</div>

    <div class="kpis" style="margin-top:14px">${kpi('EMIs / month',inr(f.emi),pct(f.emiRatio)+' of income',f.emiRatio>.4?'neg':f.emiRatio>.3?'warn':'')}${kpi('Debt-free (current pace)',base.stuck?'Never':dfd(base.months),base.months?base.months+' months':'')}${kpi('Interest still to pay',inr(base.interest),'','neg')}</div></div></div>

    <div class="kpis" style="margin-top:16px">${kpi('New debt-free date',plan.stuck?'Never':dfd(plan.months),plan.months+' months')}${kpi('Months saved',Math.max(0,msaved),'','pos')}${kpi('Interest saved',inr(Math.max(0,saved)),'','pos')}</div>
    ${plan.order.length?`<p class="small" style="margin-top:14px"><b>Payoff order:</b> ${plan.order.map((l,i)=>`${i+1}. ${esc(l.name)} <span class="muted">(${dfd(l.done)})</span>`).join(' → ')}</p>`:''}</div>

}

/* ---- health helpers (Halvi dial & bars, Cairnly streak, heatmap & cairn) ---- */
const dailyHabits=()=>state.health.habits.filter(h=>h.period==='daily');
function dayRatio(d){const hs=dailyHabits();if(!hs.length)return 0;const c=state.health.checks[periodKey('daily',d)]||{};return hs.filter(h=>c[h.id]).length/hs.length}
function fullStreak(){const t=today();let cur=0,d=t;if(dayRatio(d)<.8)d=addDays(d,-1);while(dayRatio(d)>=.8&&cur<3650){cur++;d=addDays(d,-1)}
  let best=0,run=0;for(let i=365;i>=0;i--){if(dayRatio(addDays(t,-i))>=.8){run++;best=Math.max(best,run)}else run=0}return {cur,best:Math.max(best,cur)}}
function dayScore(d){const l=state.health.logs[ds(d)]||{};return Math.round(100*(.4*dayRatio(d)+.25*Math.min(num(l.steps)/10000,1)+.15*Math.min(num(l.water)/12,1)+.2*Math.min(num(l.sleep)/8,1)))}
function dial(score){const N=48,on=Math.round(score/100*N);let s='';
  for(let i=0;i<N;i++){const a=(135+i*270/(N-1))*Math.PI/180,c=Math.cos(a),n=Math.sin(a),col=i<on?`color-mix(in srgb,var(--cyan) ${Math.round(100-i/(N-1)*100)}%,var(--lime))`:'var(--line)';
    s+=`<line class="${i<on?'on':''}" style="--t:${i};stroke:${col}" x1="${(100+c*66).toFixed(1)}" y1="${(100+n*66).toFixed(1)}" x2="${(100+c*88).toFixed(1)}" y2="${(100+n*88).toFixed(1)}"/>`}
  return `<div class="dial"><svg viewBox="0 0 200 200" role="img" aria-label="Score ${score} out of 100">${s}</svg><div class="dv"><div><div class="dn">${score}</div><div class="tiny muted">out of 100</div></div></div></div>`}
function stepsBars(days,steps){
  const W=640,H=220,pl=6,pr=6,pt=22,pb=26,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(12000,...steps)*1.08,bw=iw/days.length,Y=v=>pt+ih-v/mx*ih;
  let s='';days.forEach((d,i)=>{const v=steps[i],x=pl+i*bw+bw*.18,w=bw*.64,h=Math.max(v/mx*ih,4),isT=i===days.length-1;
    s+=`<rect class="b" style="--b:${i};fill:${isT?'var(--lime)':v>=10000?'url(#hatchL)':'url(#hatch)'};stroke:${isT?'none':v>=10000?'color-mix(in srgb,var(--lime) 55%,transparent)':'var(--line2)'}" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(12,w/2).toFixed(1)}"><title>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: ${v.toLocaleString('en-IN')} steps</title></rect>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle" ${isT?'style="fill:var(--text);font-weight:600"':''}>${isT?'Today':['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]+' '+d.getDate()}</text>`;
    if(isT&&v)s+=`<text x="${(x+w/2).toFixed(1)}" y="${(pt+ih-h-7).toFixed(1)}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v>=1000?(v/1000).toFixed(1)+'k':v}</text>`});
  const gy=Y(10000);s+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:5 6"/><rect x="${W-pr-46}" y="${gy-10}" width="44" height="20" rx="10" style="fill:var(--card2);stroke:var(--line2)"/><text x="${W-pr-24}" y="${gy+4}" text-anchor="middle" style="fill:var(--text);font-weight:600">10k</text>`;
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Steps, last ${days.length} days">${s}</svg>`}
function heatmap(){
  const t=today(),start=addDays(t,-((t.getDay()+6)%7)-15*7),L=['M','','W','','F','','S'];let cells='';
  for(let r=0;r<7;r++){cells+=`<span class="dl">${L[r]}</span>`;
    for(let c=0;c<16;c++){const d=addDays(start,c*7+r),fut=d>t,k=ds(d),v=fut?0:dayRatio(d),lv=fut?'fut':v>=.8?'l3':v>=.5?'l2':v>0?'l1':'';
      cells+=`<button class="hc ${lv} ${k===ds(t)?'today':''} ${ui.hmDay===k?'sel':''}" style="--c:${c}" ${fut?'disabled aria-hidden="true"':`data-hm="${k}"`} title="${fmt(d,{weekday:'short',day:'numeric',month:'short'})}${fut?'':' · '+Math.round(v*100)+'%'}"></button>`}}
  let months='<span></span>',last=-1;for(let c=0;c<16;c++){const d=addDays(start,c*7);months+=`<span>${d.getMonth()!==last?MONTHS[d.getMonth()]:''}</span>`;last=d.getMonth()}

let cairnFrom=0;
function cairn(done,total){

  const from=pageChanged?0:cairnFrom;cairnFrom=n;let y=146,s='';

    y-=h-4}
  return `<svg class="cairn" viewBox="0 0 200 150" width="100%" style="max-width:210px" role="img" aria-label="${n} of ${slots} stones">${s}</svg>`}

function go(p){const [pg,v]=String(p).split(':');if(scryOpen)closeScry();pageChanged=pg!==ui.page||!!v||pageChanged;ui.page=pg;if(v)ui.remView=v;menu=null;document.body.classList.remove('navopen');render();window.scrollTo(0,0)}

/* ================= search (Scry: icon slides open into a field, becomes a close button) ================= */
let scryOpen=false,scryQ='',sHits=[];
function openScry(){
  if(menu){menu=null;renderShell()}
  const el=$('#scry');if(!el)return;scryOpen=true;void el.offsetWidth;el.classList.add('open');
  el.querySelector('.scry-btn').setAttribute('aria-label','Close search');
  if(!$('#sres')){const d=document.createElement('div');d.className='pop wide scry-res';d.id='sres';el.appendChild(d)}
  runSearch(scryQ);setTimeout(()=>$('#scryIn')?.focus(),RM()?0:180);
}
function closeScry(){scryOpen=false;scryQ='';const el=$('#scry');if(!el)return;el.classList.remove('open');const i=$('#scryIn');i.value='';i.blur();$('#sres')?.remove();el.querySelector('.scry-btn').setAttribute('aria-label','Search')}
function runSearch(q){
  const box=$('#sres');if(!box)return;q=q.trim().toLowerCase();const H=[];
  const add=(grp,label,sub,act)=>{if(!q||(label+' '+sub).toLowerCase().includes(q))H.push({grp,label,sub,act})};
  NAV.flatMap(n=>n[1]).forEach(([k,l])=>add('Pages',l,'',{go:k}));
  if(q){
    state.reminders.forEach(r=>add('Reminders',r.title,r.type+(r.date?' · '+fmt(pd(r.date),{day:'numeric',month:'short'}):''),{go:'reminders',edit:['reminders',r.id]}));
    state.bills.forEach(b=>add('Bills',b.name,inr(b.amount)+' · '+b.freq,{go:'bills',edit:['bills',b.id]}));
    state.goals.forEach(g=>add('Goals',g.title,g.category,{go:'goals',edit:['goals',g.id]}));
    state.loans.forEach(l=>add('Loans',l.name,inr(l.outstanding)+' left',{go:'debt',edit:['loans',l.id]}));
    state.savings.forEach(x=>add('Savings',x.name,inr(x.current),{go:'savings',edit:['savings',x.id]}));
    state.tx.forEach(t=>add('Payments',t.payee,`${inr(t.amount)} · ${t.category} · ${fmt(pd(t.date),{day:'numeric',month:'short'})}`,{go:'activity',edit:['tx',t.id]}));
    state.health.habits.forEach(h=>add('Habits',h.name,h.period,{go:h.area==='Grooming'?'grooming':'health',edit:['habits',h.id]}));
    state.checklist.forEach(c=>add('Checklist',c.item,c.area,{go:'checklist',edit:['checklist',c.id]}));
    state.grooming.products.forEach(x=>add('Grooming',x.name,x.category,{go:'grooming',edit:['products',x.id]}));
  }
  sHits=H.slice(0,40);let last='';
  box.innerHTML=sHits.map((h,i)=>{const g=h.grp!==last?`<div class="grp">${h.grp}</div>`:'';last=h.grp;return g+`<button class="mi" data-hit="${i}"><span>${esc(h.label)}</span><small>${esc(h.sub)}</small></button>`}).join('')||'<div class="empty">No matches.</div>';
}
function pickHit(i){const h=sHits[i];if(!h)return;closeScry();go(h.act.go);if(h.act.edit)openForm(h.act.edit[0],h.act.edit[1])}
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg($('#dlg'))});

/* Lumen: theme switch with a circle reveal from the button */
function lumen(btn){
  const cur=document.documentElement.dataset.theme,isLight=cur==='light'||(cur==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);
  const apply=()=>{state.profile.theme=isLight?'dark':'light';save();render()};
  if(!document.startViewTransition||RM()){apply();return}
  const [x,y]=center(btn),r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:720,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
}

/* ================= export / import ================= */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function fold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=' '+l.slice(73)}out.push(l);return out.join('\r\n')}
function exportICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aditya Life Dashboard//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Aditya Life Dashboard'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const add=(id,date,title,desc,rrule,lead)=>{const d=ds(date).replace(/-/g,''),e=ds(addDays(date,1)).replace(/-/g,'');const trig=lead>0?`-PT${lead*24-9}H`:'PT9H';
    L.push('BEGIN:VEVENT','UID:'+id+'@aditya-life-dashboard','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+icsEsc(title));
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(rrule)L.push('RRULE:'+rrule);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+trig,'END:VALARM','END:VEVENT')};
  const RR={weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',quarterly:'FREQ=MONTHLY;INTERVAL=3','half-yearly':'FREQ=MONTHLY;INTERVAL=6',yearly:'FREQ=YEARLY'};
  let n=0;const t=today();
  for(const r of state.reminders){if(!r.date)continue;add(r.id,pd(r.date),r.title,(r.notes||'')+(r.amount?` Amount: ₹${r.amount}`:''),RR[r.repeat]||'',num(r.lead));n++}
  for(const b of state.bills){const nd=nextBillDate(b);if(!nd)continue;add('bill-'+b.id,nd,`Pay: ${b.name}${num(b.amount)?' (₹'+num(b.amount).toLocaleString('en-IN')+')':''}`,b.notes||'',RR[b.freq]||'FREQ=MONTHLY',2);n++}
  for(const l of state.loans){if(num(l.outstanding)<=0||num(l.emi)<=0)continue;const s=loanSim(l),nd=monthlyOcc(2000,0,num(l.dueDay)||1,1,t,addDays(t,40),null)[0];if(!nd)continue;add('emi-'+l.id,nd,`EMI: ${l.name} (₹${num(l.emi).toLocaleString('en-IN')})`,l.lender||'','FREQ=MONTHLY'+(isFinite(s.n)?';COUNT='+s.n:''),2);n++}
  L.push('END:VCALENDAR');download('aditya-reminders.ics',L.map(fold).join('\r\n'),'text/calendar');
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Date','Payee','Category','Direction','Amount','Method','Note'],...[...state.tx].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>[t.date,t.payee,t.dir==='in'?'Income':t.category,t.dir==='in'?'in':'out',t.amount,t.method,t.note])];
  download(`payments-${ds(today())}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function clearSamples(){
  if(!confirm('Remove all sample income, budget categories, bills, loans, savings and payments? Anything you’ve edited stays.'))return;
  for(const k of ['income','expenses','bills','loans','savings','tx'])state[k]=state[k].filter(x=>!x.sample);
  commit();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const hit=e.target.closest('[data-hit]');if(hit){pickHit(+hit.dataset.hit);return}
  if(scryOpen&&!e.target.closest('#scry'))closeScry();
  const el=e.target.closest('[data-go],[data-add],[data-edit],[data-act],[data-set],[data-habit],[data-check],[data-ms],[data-goaltap],[data-gset],[data-paid],[data-prepay],[data-day],[data-water],[data-ins],[data-bought],[data-glass],[data-hm],[data-hd],[data-mood]');
  if(!el){if(menu&&!e.target.closest('.pop')){menu=null;renderShell()}return}
  if(el.closest('#dlg'))return;
  const d=el.dataset;
  if(menu&&!el.closest('.pop')&&d.act!=='bell'&&d.act!=='new')menu=null;
  if(d.paid){e.stopPropagation();const was=!!state.paid[d.paid];justId=d.paid;togglePaid(d.paid);if(!was){toast('Marked as paid');burst(...lastXY,12)}return}
  if(d.go){go(d.go);return}
  if(d.add){let pre={};try{pre=JSON.parse(d.pre||'{}')}catch(x){}if(d.date){pre.date=d.date;pre.repeat='none'}if(d.type)pre.type=d.type;if(d.add==='tx'){pre.date=pre.date||ds(today());pre.dir=pre.dir||'out';pre.method=pre.method||'UPI'}if(d.add==='reminders'&&!pre.repeat)pre.repeat='yearly';menu=null;openForm(d.add,null,pre);renderShell();return}
  if(d.edit){openForm(d.edit,d.id);return}
  if(d.set){const [k,v]=d.set.split(':');ui[k]=['bm','txDays','ovRange'].includes(k)?+v:v;render();return}
  if(d.habit){const h=state.health.habits.find(x=>x.id===d.habit);if(!h)return;const now=!isDone(h);setDone(h,now);justId=h.id;commit();
    if(now){burst(...lastXY,8);const per=state.health.habits.filter(x=>x.period===h.period&&x.area===h.area);if(per.every(x=>isDone(x))){burst(innerWidth/2,innerHeight/3,46);toast(`All ${h.period} ${h.area==='Grooming'?'grooming':'health'} habits done!`,'flame')}}return}
  if(d.hd){const h=state.health.habits.find(x=>x.id===d.hd);if(!h||!ui.hmDay)return;const day=pd(ui.hmDay);setDone(h,!isDone(h,day),day);justId=h.id+'@'+ui.hmDay;commit();return}
  if(d.hm){ui.hmDay=ui.hmDay===d.hm?null:d.hm;render();return}
  if(d.glass){const k=ds(today()),lg=state.health.logs[k]=state.health.logs[k]||{},n=+d.glass;lg.water=num(lg.water)===n?n-1:n;autoHabits();commit();if(lg.water===12){burst(...lastXY,30,['var(--cyan)','#fff','var(--lime)']);toast('3 litres! Water goal done','drop')}return}
  if(d.mood){document.querySelectorAll('.mood').forEach(b=>b.classList.toggle('on',b===el));el.closest('.card').dataset.mood=d.mood;return}
  if(d.check){const c=state.checklist.find(x=>x.id===d.check);if(c){c.done=!c.done;justId=c.id;commit();if(c.done){burst(...lastXY,10);toast('Checked off')}}return}
  if(d.ms){const g=state.goals.find(x=>x.id===d.ms);if(g){const m=g.milestones[+d.i];m.done=!m.done;justId=g.id+':'+d.i;commit();if(m.done){burst(...lastXY,12);toast('Milestone done')}}return}
  if(d.goaltap){const g=state.goals.find(x=>x.id===d.goaltap);if(!g)return;
    if(g.link){go(g.link==='debt'?'debt':'savings');return}
    if(!num(g.target)){openForm('goals',g.id);return}
    const v=prompt(`Add progress to "${g.title}"${g.unit?' ('+g.unit+')':''}:`,g.unit==='₹'?'':'1');if(v!==null&&num(v)){const before=goalProg(g).p;g.current=Math.max(0,num(g.current)+num(v));commit();if(goalProg(g).p>=1&&before<1){burst(innerWidth/2,innerHeight/3,60);toast(`Goal reached: ${g.title}`,'target')}else toast('Progress added')}return}
  if(d.gset){const g=state.goals.find(x=>x.id===d.gset);const v=prompt(`Current value for "${g.title}"`,g.current);if(v!==null){g.current=num(v);commit()}return}
  if(d.prepay){const l=state.loans.find(x=>x.id===d.prepay);const v=prompt(`Prepayment amount for "${l.name}" (₹). This reduces the outstanding balance directly.`);if(v!==null&&num(v)>0){l.outstanding=Math.max(0,num(l.outstanding)-num(v));delete l.sample;commit()}return}
  if(d.day){ui.dayPick=ui.dayPick===d.day?null:d.day;render();return}
  if(d.ins){ui.ins=(ui.ins||0)+1;render();return}
  if(d.bought){const p=state.grooming.products.find(x=>x.id===d.bought);if(!p)return;p.bought=ds(today());
    if(num(p.price)&&confirm(`Restocked ${p.name}. Also log ${inr(p.price)} in Activity?`)){const c=state.expenses.find(e=>/groom|care/i.test(e.name));state.tx.push({id:uid(),date:ds(today()),payee:p.name,category:c?c.name:'Other',amount:num(p.price),dir:'out',method:'UPI',note:'Grooming restock'})}
    commit();toast(`${p.name} restocked`);return}
  if(d.water){const k=ds(today()),lg=state.health.logs[k]=state.health.logs[k]||{};lg.water=Math.max(0,num(lg.water)+num(d.water));autoHabits();commit();return}
  switch(d.act){
    case'nav':document.body.classList.toggle('navopen');return;
    case'collapse':ui.collapsed=!ui.collapsed;render();return;
    case'search':openScry();return;
    case'scry':scryOpen?closeScry():openScry();return;
    case'jsave':{const card=el.closest('.card'),t=$('#jl').value.trim(),k=ds(today()),J=state.journal=state.journal||{},m=num(card.dataset.mood||J[k]?.m);if(!t&&!m){toast('Write a line first','journal');return}J[k]={t,m};commit();toast('Saved today’s line','journal');return}
    case'lock':lockNow();return;
    case'cutToday':state.grooming.lastCut=ds(today());{const h=state.health.habits.find(x=>/^Haircut/.test(x.name));if(h)setDone(h,true)}commit();burst(...lastXY,16);toast('Fresh cut logged','scissors');return;
    case'bell':menu=menu==='bell'?null:'bell';renderShell();return;
    case'new':menu=menu==='new'?null:'new';renderShell();return;
    case'theme':lumen(el);return;
    case'export':download(`life-dashboard-backup-${ds(today())}.json`,JSON.stringify(state,null,1),'application/json');return;
    case'import':$('#importFile').click();return;
    case'ics':exportICS();return;
    case'csv':exportCSV();return;
    case'clearSamples':clearSamples();return;
    case'reset':if(confirm('Reset EVERYTHING to the starting template? Export a backup first if you want to keep your data.')){state=defaults();commit()}return;
  }
});
$('#overlay').addEventListener('click',()=>document.body.classList.remove('navopen'));
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(el.closest('#dlg'))return;

document.addEventListener('submit',e=>{
  if(e.target.id!=='pwform')return;e.preventDefault();
  const f=e.target,msg=$('#pwmsg'),cur=f.cur.value,a=f.nw.value,b=f.nw2.value;
  if(!checkPw(cur)){msg.textContent='Current password is wrong.';msg.className='small neg';return}
  if(a.length<6){msg.textContent='Use at least 6 characters.';msg.className='small neg';return}
  if(a!==b){msg.textContent='New passwords don’t match.';msg.className='small neg';return}
  const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
  try{localStorage.setItem(LOCKKEY,JSON.stringify({salt,hash:stretch(a,salt)}));f.reset();msg.textContent='Password changed for this browser.';msg.className='small pos'}
  catch(err){msg.textContent='Couldn’t save: browser storage is blocked.';msg.className='small neg'}
});
/* ================= lock ================= */
let lockFails=0,lockUntil=0,lastActive=Date.now();
function lockNow(){try{sessionStorage.removeItem(UNLOCKKEY);localStorage.removeItem(UNLOCKKEY)}catch(e){}showLock()}
function showLock(){
  menu=null;document.body.classList.remove('navopen');document.body.classList.add('locked');
  $('#main').innerHTML='';$('#side').innerHTML='';$('#topbar').innerHTML='';
  if($('#dlg').open)$('#dlg').close();if(scryOpen)closeScry();
  $('#lockhi').textContent=`Welcome back, ${state.profile.first||'there'}`;$('#lockerr').textContent='';$('#lockpw').value='';
  document.title="Locked · Aditya's Life Dashboard";applyTheme();setTimeout(()=>$('#lockpw').focus(),30);
}
$('#lockf').addEventListener('submit',e=>{
  e.preventDefault();
  if(Date.now()<lockUntil){$('#lockerr').textContent=`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`;return}
  const btn=$('#lockbtn');btn.textContent='Checking…';btn.disabled=true;
  setTimeout(()=>{
    const ok=checkPw($('#lockpw').value);btn.textContent='Unlock';btn.disabled=false;
    if(ok){lockFails=0;try{sessionStorage.setItem(UNLOCKKEY,'1');if($('#lockrem').checked)localStorage.setItem(UNLOCKKEY,String(Date.now()+30*86400000))}catch(err){}
      (async()=>{const reset=RM()?null:await gyre();document.body.classList.remove('locked');if(reset)reset();lastActive=Date.now();autoHabits();pageChanged=true;render();window.scrollTo(0,0)})();return}
    lockFails++;if(lockFails>=5){lockUntil=Date.now()+30000;lockFails=0}
    $('#lockerr').textContent='Wrong password. Try again.';const c=$('#lockf');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#lockpw').select();
  },20);
});
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
setInterval(()=>{let remembered=false;try{remembered=+localStorage.getItem(UNLOCKKEY)>Date.now()}catch(e){}
  if(!remembered&&!document.body.classList.contains('locked')&&Date.now()-lastActive>30*60000)lockNow()},60000);
let qT;
document.addEventListener('input',e=>{if(e.target.id==='scryIn'){scryQ=e.target.value;runSearch(scryQ);return}const d=e.target.dataset;if(d.ui==='txQ'||d.ui==='remQ'){clearTimeout(qT);const k=d.ui,v=e.target.value;qT=setTimeout(()=>{ui[k]=v;render();const inp=document.querySelector(`[data-ui="${k}"]`);if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}},250)}});
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('locked'))return;
  if(e.target.id==='scryIn'){if(e.key==='Escape'){e.preventDefault();closeScry()}else if(e.key==='Enter'){e.preventDefault();pickHit(0)}return}
  const typing=e.target.matches('input,textarea,select');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();scryOpen?closeScry():openScry();return}
  if(typing){if(e.key==='Enter'&&e.target.matches('input[data-log],input[data-month],input[data-ui="extra"],input[data-prof]'))e.target.blur();return}
  if($('#dlg').open)return;
  if(e.key==='/'){e.preventDefault();openScry()}
  else if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openForm('tx',null,{date:ds(today()),dir:'out',method:'UPI'})}
  else if(e.key==='Escape'&&menu){menu=null;renderShell()}
});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#/','');if(PAGES[p]&&p!==ui.page)go(p)});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();

  rd.readAsText(f);
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>render());

{const p=location.hash.replace('#/','');if(PAGES[p])ui.page=p}
if(isUnlocked()){autoHabits();render()}else showLock();
