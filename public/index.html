function pBudget(){
  const t=today(),bd=addMonths(t,-ui.bm),y=bd.getFullYear(),m=bd.getMonth(),isCur=ui.bm===0;
  const dayP=isCur?t.getDate()/dim(y,m):ui.bm>0?1:0;
  const txs=txIn(y,m).filter(x=>x.dir!=='in');
  const rows=state.expenses.map(e=>{const s=sum(txs.filter(x=>x.category===e.name),x=>x.amount),cap=num(e.amount);return {e,s,cap,u:cap?s/cap:0}});
  const known=new Set(state.expenses.map(e=>e.name)),other=sum(txs.filter(x=>!known.has(x.category)),x=>x.amount);
  const cap=sum(rows,r=>r.cap),spent=sum(txs,x=>x.amount),left=cap-spent,dl=dim(y,m)-t.getDate()+1;
  const st=r=>r.cap?r.u>1?'over':r.u>=.85?'near':'ok':'none';
  const cnt={over:0,near:0,ok:0};rows.forEach(r=>{const s=st(r);if(cnt[s]!==undefined)cnt[s]++});
  let list=rows.filter(r=>ui.bFilter==='all'||(ui.bFilter==='near'?['over','near'].includes(st(r)):st(r)==='none'));
  list.sort(ui.bSort==='az'?(a,b)=>a.e.name.localeCompare(b.e.name):ui.bSort==='left'?(a,b)=>(a.cap-a.s)-(b.cap-b.s):(a,b)=>b.u-a.u);
  const pill=s=>s==='over'?'<span class="pill red">Over</span>':s==='near'?'<span class="pill yellow">Near the cap</span>':s==='ok'?'<span class="pill lime">On track</span>':'<span class="pill">No cap</span>';
  const f=fin(),I=f.income||1;
  const seg=[['Bills',f.bills,'var(--orange)'],['EMIs',f.emi,'var(--red)'],['Spending',f.spend,'var(--violet)'],['Left to save',Math.max(0,f.left),'var(--lime)']];
  return `${phead('Money · Budget & income','Budget',`<div class="seg"><button data-set="bm:${ui.bm+1}" title="Previous month">${ic('left')}</button><button class="on">${MONTHS_FULL[m]} ${y}</button><button data-set="bm:${Math.max(0,ui.bm-1)}" ${isCur?'disabled style="opacity:.35"':''} title="Next month">${ic('right')}</button></div><button class="btn lime" data-add="expenses">${ic('plus')} Add category</button>`)}
  <div class="stack">${sampleBanner()}
  <div class="card" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">${donut(cap?spent/cap:0,150,pct(cap?spent/cap:0),'used')}
    <div style="flex:1;min-width:220px"><div class="tiny faint" style="letter-spacing:.08em;text-transform:uppercase;font-weight:600">${MONTHS_FULL[m]} ${y}${isCur?` · day ${t.getDate()} of ${dim(y,m)}`:''}</div>
    <div class="big" style="margin:4px 0">${inr(spent)} <span class="small muted" style="font-weight:500">of ${inr(cap)} budgeted</span></div>
    <div class="small muted">${isCur?(left>=0?`<b style="color:var(--text)">${inr(left)}</b> left for the last ${dl} day${dl>1?'s':''} of ${MONTHS_FULL[m]} · about <b style="color:var(--text)">${inr(left/dl)}</b> a day.`:`<b class="neg">${inr(-left)}</b> over budget this month.`):(left>=0?`Finished ${inr(left)} under budget.`:`Finished ${inr(-left)} over budget.`)}</div>
    <div class="chips" style="margin-top:10px"><span class="pill red">${cnt.over} over</span><span class="pill yellow">${cnt.near} near the cap</span><span class="pill lime">${cnt.ok} on track</span>${other?`<span class="pill">${inr(other)} uncategorised</span>`:''}</div></div></div>
  <div class="card"><div class="ch"><div><h3>Categories</h3><div class="sub">The tick on each bar is where even spending would be today. Tap a row to change its cap.</div></div><span class="sp"></span>
    <div class="seg">${[['all','All'],['near','Near or over'],['none','No cap']].map(([v,l])=>`<button class="${ui.bFilter===v?'on':''}" data-set="bFilter:${v}">${l}</button>`).join('')}</div>
    <div class="seg">${[['used','% used'],['left','Left'],['az','A–Z']].map(([v,l])=>`<button class="${ui.bSort===v?'on':''}" data-set="bSort:${v}">${l}</button>`).join('')}</div></div>
    <div class="catgrid">${list.map(r=>{const s=st(r);return `<div class="cat" data-edit="expenses" data-id="${r.e.id}">${icoBox(catIcon(r.e.name),pcol(r.e.name))}<div class="cb"><div class="ct"><b>${esc(r.e.name)}</b>${pill(s)}<span class="amt">${inr(r.s)} <small>of ${inr(r.cap)}</small></span></div>${gbar(r.u,r.u>1,r.cap?dayP:null)}<div class="cs">${r.cap?(r.s<=r.cap?`${inr(r.cap-r.s)} left · ${pct(r.u)} used`:`<span class="neg">${inr(r.s-r.cap)} over</span> · ${pct(r.u)} used`):'No cap set'} · ${r.e.kind==='want'?'Want':'Need'}</div></div></div>`}).join('')||'<div class="empty">Nothing in this filter.</div>'}</div></div>
  <div class="r2">
    <div class="card"><div class="ch"><div><h3>Income</h3><div class="sub">Counted every month automatically</div></div><span class="sp"></span><button class="btn sm" data-add="income">${ic('plus')} Add</button></div>
      ${state.income.map(x=>`<div class="ri clickable" data-edit="income" data-id="${x.id}">${icoBox('rupee','var(--lime)')}<div class="rb"><div class="rt">${esc(x.name)}</div>${x.notes?`<div class="rs">${esc(x.notes)}</div>`:''}</div><div class="ra pos">${inr(x.amount)}</div></div>`).join('')||'<div class="empty">Add your salary / business income.</div>'}
      <div class="ri"><div class="rb"><b>Total per month</b></div><div class="ra">${inr(f.income)}</div></div></div>
    <div class="card"><div class="ch"><div><h3>Where each month goes (plan)</h3><div class="sub">Bills + EMIs + budget vs income</div></div></div>

      <div class="leg">${seg.map(s=>`<div><b style="background:${s[2]}"></b><span>${s[0]}</span><em>${inr(s[1])} · ${pct(s[1]/I)}</em></div>`).join('')}</div>
      <div class="glabel" style="margin-top:18px">50 / 30 / 20 check</div>
      ${[['Needs',f.needs/I,.5,'≤ 50%',0],['Wants',f.wants/I,.3,'≤ 30%',0],['Savings',Math.max(0,f.left)/I,.2,'≥ 20%',1]].map(([l,v,tg,txt,up])=>{const ok=up?v>=tg:v<=tg;return `<div style="margin:10px 0"><div class="inline" style="justify-content:space-between;margin-bottom:6px"><span class="small">${l} <span class="faint">(${txt})</span></span><b class="small ${ok?'pos':'neg'}">${pct(v)}</b></div>${gbar(v,!ok)}</div>`}).join('')}</div>
  </div></div>`;

function nextBillDate(b){const t=today();const st=STEP[b.freq]||1;return monthlyOcc(2000,st===1?0:num(b.startMonth),num(b.dueDay)||1,st,t,addDays(t,400),null)[0]}

function pDebt(){
  const f=fin(),t=today(),base=simulate(0,'avalanche',false),plan=simulate(num(ui.extra),ui.strategy,true);
  const P=sum(state.loans,l=>Math.max(num(l.principal),num(l.outstanding))),paidPct=P?1-f.debt/P:0;
  const dfd=m=>m?fmt(addMonths(t,m),{month:'short',year:'numeric'}):'Debt-free';
  const cards=[...state.loans].sort((a,b)=>num(b.rate)-num(a.rate)).map(l=>{
    const s=loanSim(l),pr=Math.max(num(l.principal),num(l.outstanding)),pp=pr?1-num(l.outstanding)/pr:0,r=num(l.rate);
    const pk=`L:${l.id}|${ym(t.getFullYear(),t.getMonth())}`,paid=state.paid[pk];
    return `<div class="card"><div class="ch" style="align-items:center">${icoBox('card',r>=18?'var(--red)':'var(--cyan)')}<div><h3>${esc(l.name)}</h3><div class="sub">${esc(l.lender||'')} · ${esc(l.type||'')}</div></div><span class="sp"></span>${r>=18?'<span class="pill red">High interest</span>':''}<button class="ic" data-edit="loans" data-id="${l.id}">${ic('edit')}</button></div>
    <div class="inline" style="justify-content:space-between;margin-bottom:8px"><span class="mid">${inr(num(l.outstanding))}</span><span class="small muted">left of ${inr(pr)} · ${pct(pp)} repaid</span></div>${gbar(pp)}
    <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">
      ${[['Rate',r+'%'],['EMI',inr(num(l.emi))],['Months left',isFinite(s.n)?s.n:'∞'],['Payoff',isFinite(s.n)?dfd(s.n):'Never'],['Interest left',isFinite(s.int)?`<span class="neg">${inr(s.int)}</span>`:'—']].map(([a,b])=>`<div><div class="tiny muted">${a}</div><b>${b}</b></div>`).join('')}</div>
    ${!isFinite(s.n)&&num(l.outstanding)>0?'<p class="small neg" style="margin-top:10px">The EMI doesn’t cover the monthly interest, so the balance keeps growing.</p>':''}
    <div class="inline small" style="margin-top:12px;gap:8px"><span class="muted">First EMI</span>${l.startDate?`<b>${fmt(pd(l.startDate),{day:'numeric',month:'short',year:'numeric'})}</b>${pd(l.startDate)>t?' <span class="pill cyan nodot">starts later</span>':''}`:`<input type="date" class="sel" data-lstart="${l.id}" aria-label="First EMI date" style="height:30px"><span class="tiny muted">Add it so past and future months are right</span>`}</div>
    ${l.notes?`<p class="tiny muted" style="margin-top:10px">${esc(l.notes)}</p>`:''}
    <div class="inline" style="margin-top:14px">${num(l.outstanding)>0?`<button class="btn sm ${paid?'done':''} ${justId===pk?'bump':''}" data-paid="${pk}">${paid?ic('tick')+` ${MONTHS[t.getMonth()]} EMI paid`:`Mark ${MONTHS[t.getMonth()]} EMI paid`}</button><button class="btn sm ghost" data-prepay="${l.id}">Record prepayment</button>`:'<span class="pill lime">Closed 🎉</span>'}</div></div>`}).join('');
  const saved=base.interest-plan.interest,msaved=base.months-plan.months;
  return `${phead('Money · Loans & EMIs','Debt',`<button class="btn lime" data-add="loans">${ic('plus')} Add loan</button>`)}
  <div class="stack">${sampleBanner()}
  <div class="card" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">${donut(paidPct,150,pct(paidPct),'repaid')}
    <div style="flex:1;min-width:240px"><div class="tiny faint" style="letter-spacing:.08em;text-transform:uppercase;font-weight:600">Total outstanding</div><div class="big">${inr(f.debt)}</div>
    <div class="small muted">${inr(P-f.debt)} repaid of ${inr(P)} borrowed</div>
    <div class="kpis" style="margin-top:14px">${kpi('EMIs / month',inr(f.emi),pct(f.emiRatio)+' of income',f.emiRatio>.4?'neg':f.emiRatio>.3?'warn':'')}${kpi('Debt-free (current pace)',base.stuck?'Never':dfd(base.months),base.months?base.months+' months':'')}${kpi('Interest still to pay',inr(base.interest),'','neg')}</div></div></div>
  ${debtPlanCard()}
  <div class="card"><div class="ch"><div><h3>Get debt-free faster</h3><div class="sub">When a loan closes, its EMI rolls into the next one.</div></div></div>
    <div class="inline"><label for="extra">Extra I can pay each month</label><input id="extra" type="number" inputmode="decimal" data-ui="extra" value="${esc(ui.extra)}" style="width:130px">
    <div class="seg"><button class="${ui.strategy==='avalanche'?'on':''}" data-set="strategy:avalanche">Avalanche · highest interest first</button><button class="${ui.strategy==='snowball'?'on':''}" data-set="strategy:snowball">Snowball · smallest balance first</button></div></div>
    <div class="kpis" style="margin-top:16px">${kpi('New debt-free date',plan.stuck?'Never':dfd(plan.months),plan.months+' months')}${kpi('Months saved',Math.max(0,msaved),'','pos')}${kpi('Interest saved',inr(Math.max(0,saved)),'','pos')}</div>
    ${plan.order.length?`<p class="small" style="margin-top:14px"><b>Payoff order:</b> ${plan.order.map((l,i)=>`${i+1}. ${esc(l.name)} <span class="muted">(${dfd(l.done)})</span>`).join(' → ')}</p>`:''}</div>
  <div class="r2">${cards||'<div class="card empty">No loans. Enjoy the freedom! 🎉</div>'}</div>
  ${cardSection()}
  <div class="card"><h3 style="margin-bottom:8px">Debt rules worth keeping</h3><ul class="tips">
    <li>Pay credit cards in <b>full</b> every month. “Minimum due” keeps ~40% yearly interest running.</li>
    <li>Prepay the highest-interest loan first. A home loan (~8–9%) is usually last.</li>
    <li>RBI rules: floating-rate loans to individuals carry no foreclosure or prepayment charges. Fixed-rate loans may. Check your agreement.</li>

    <li>When you close a loan, collect the <b>NOC</b> and check that your CIBIL report shows it as “closed”.</li></ul></div></div>`;
}

/* ---- health helpers (Halvi dial & bars, Cairnly streak, heatmap & cairn) ---- */
const dailyHabits=()=>state.health.habits.filter(h=>h.period==='daily');
function dayRatio(d){const hs=dailyHabits();if(!hs.length)return 0;const c=state.health.checks[periodKey('daily',d)]||{};return hs.filter(h=>c[h.id]).length/hs.length}
function fullStreak(){const t=today();let cur=0,d=t;if(dayRatio(d)<.8)d=addDays(d,-1);while(dayRatio(d)>=.8&&cur<3650){cur++;d=addDays(d,-1)}
  let best=0,run=0;for(let i=365;i>=0;i--){if(dayRatio(addDays(t,-i))>=.8){run++;best=Math.max(best,run)}else run=0}return {cur,best:Math.max(best,cur)}}
function dayScore(d){const l=state.health.logs[ds(d)]||{};return Math.round(100*(.4*dayRatio(d)+.25*Math.min(num(l.steps)/10000,1)+.15*Math.min(num(l.water)/12,1)+.2*Math.min(num(l.sleep)/8,1)))}
function dial(score){const N=48,on=Math.round(score/100*N);let s='';
  for(let i=0;i<N;i++){const a=(135+i*270/(N-1))*Math.PI/180,c=Math.cos(a),n=Math.sin(a),col=i<on?`color-mix(in srgb,var(--cyan) ${Math.round(100-i/(N-1)*100)}%,var(--lime))`:'var(--line)';
    s+=`<line class="${i<on?'on':''}" style="--t:${i};stroke:${col}" x1="${(100+c*66).toFixed(1)}" y1="${(100+n*66).toFixed(1)}" x2="${(100+c*88).toFixed(1)}" y2="${(100+n*88).toFixed(1)}"/>`}
  return `<div class="dial"><svg viewBox="0 0 200 200" role="img" aria-label="Score ${score} out of 100">${s}</svg><div class="dv"><div><div class="dn">${score}</div><div class="tiny muted">out of 100</div></div></div></div>`}
function stepsBars(days,steps){
  const W=640,H=220,pl=6,pr=6,pt=22,pb=26,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(12000,...steps)*1.08,bw=iw/days.length,Y=v=>pt+ih-v/mx*ih;
  let s='';days.forEach((d,i)=>{const v=steps[i],x=pl+i*bw+bw*.18,w=bw*.64,h=Math.max(v/mx*ih,4),isT=i===days.length-1;
    s+=`<rect class="b" style="--b:${i};fill:${isT?'var(--lime)':v>=10000?'url(#hatchL)':'url(#hatch)'};stroke:${isT?'none':v>=10000?'color-mix(in srgb,var(--lime) 55%,transparent)':'var(--line2)'}" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(12,w/2).toFixed(1)}"><title>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: ${v.toLocaleString('en-IN')} steps</title></rect>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle" ${isT?'style="fill:var(--text);font-weight:600"':''}>${isT?'Today':['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]+' '+d.getDate()}</text>`;
    if(isT&&v)s+=`<text x="${(x+w/2).toFixed(1)}" y="${(pt+ih-h-7).toFixed(1)}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v>=1000?(v/1000).toFixed(1)+'k':v}</text>`});
  const gy=Y(10000);s+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:5 6"/><rect x="${W-pr-46}" y="${gy-10}" width="44" height="20" rx="10" style="fill:var(--card2);stroke:var(--line2)"/><text x="${W-pr-24}" y="${gy+4}" text-anchor="middle" style="fill:var(--text);font-weight:600">10k</text>`;
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Steps, last ${days.length} days">${s}</svg>`}
function heatmap(){
  const t=today(),start=addDays(t,-((t.getDay()+6)%7)-15*7),L=['M','','W','','F','','S'];let cells='';
  for(let r=0;r<7;r++){cells+=`<span class="dl">${L[r]}</span>`;

  let months='<span></span>',last=-1;for(let c=0;c<16;c++){const d=addDays(start,c*7);months+=`<span>${d.getMonth()!==last?MONTHS[d.getMonth()]:''}</span>`;last=d.getMonth()}

/* ================= Self Streak: account, cloud sync, AI via server ================= */
const BRAND='Self Streak';
let cloudBase=0,syncFail=0;
let account=null,usage={used:0,limit:20},cloudT=null,cloudDirty=false,pushOn=false,authMode='login';
async function apiFetch(path,opts={}){
  const r=await fetch(path,{method:opts.method||'GET',headers:opts.body!==undefined?{'content-type':'application/json'}:{},body:opts.body!==undefined?JSON.stringify(opts.body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error&&!/^[a-z_]+$/.test(d.error)?d.error:'Something went wrong. Please try again.');e.status=r.status;e.data=d;throw e}
  return d;
}
function queueCloud(now){
  if(!account)return;cloudDirty=true;clearTimeout(cloudT);
  cloudT=setTimeout(async()=>{if(!navigator.onLine)return;try{const u=state._u||Date.now(),r=await apiFetch('/api/data',{method:'PUT',body:{data:state,updated:u,base:cloudBase}});cloudBase=r.updated||u;cloudDirty=false;syncFail=0}
    catch(e){if(e.status===401)showAuth('login','Your session ended. Please log in again.');else if(e.status===409&&e.data?.data)adoptCloud(e.data.data,e.data.updated,true);else if(++syncFail<6)setTimeout(()=>queueCloud(true),15000*syncFail);else toast('Couldn’t sync to the cloud. Your changes are safe on this device.','x')}},now?10:1500);
}
function adoptCloud(data,updated,conflict){
  const fired=state.nudges?.fired||{};state=load(data);state.nudges.fired={...state.nudges.fired,...fired};cloudBase=updated;cloudDirty=false;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  nzCache.t=0;autoHabits();if(!document.body.classList.contains('locked')){render();syncSW();pushSchedule()}
  if(conflict)toast('Updated with changes from your other device','tick');
}
let pulling=false;
async function pullCloud(){
  if(!account||pulling||!navigator.onLine)return;pulling=true;
  try{const [c,m]=await Promise.all([apiFetch('/api/data'),apiFetch('/api/me').catch(()=>null)]);
    if(m){account={...account,...m};usage=m.usage||usage}
    if(c.data&&c.updated>cloudBase){if(cloudDirty)queueCloud(true);else adoptCloud(c.data,c.updated,true)}}catch(e){}finally{pulling=false}
}
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
window.addEventListener('online',()=>{if(cloudDirty)queueCloud(true)});
window.addEventListener('pagehide',()=>{if(cloudDirty&&account)try{fetch('/api/data',{method:'PUT',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({data:state,updated:state._u,base:cloudBase})})}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloudDirty)queueCloud(true)});
const hasAI=()=>!!account&&navigator.onLine&&account.user.status!=='expired'&&usage.used<usage.limit;
const modelName=()=>'AI';
const aiLeft=()=>Math.max(0,usage.limit-usage.used);
function aiErr(e){return e?.message||String(e)}
async function aiTask(task,input){
  try{const d=await apiFetch('/api/ai',{method:'POST',body:{task,input}});usage={used:d.used,limit:d.limit};return d.result}
  catch(e){if(e.data&&e.data.limit!==undefined)usage={used:e.data.used??usage.used,limit:e.data.limit};if(e.status===402){account.user.status='expired';checkPaywall()}throw e}
}
const statusLabel=()=>{if(!account)return '';const u=account.user;if(u.status==='owner')return 'Owner';if(u.status==='active')return 'Plus';if(u.status==='trial'){const d=Math.max(0,Math.ceil((u.trialEnds-Date.now())/86400000));return `Trial · ${d} day${d===1?'':'s'} left`}return 'Trial ended'};

  set(/^am skincare/i,[tm(wake,15)]);set(/sunlight/i,[tm(wake,30)]);set(/meditation/i,[tm(wake,45)]);set(/deodorant/i,[tm(wake,75)]);

const IMP_SPECIAL=['Income','Salary (already counted)','Bill payment','EMI','Transfer / ignore','Other'];
const impCats=()=>[...new Set([...state.expenses.map(e=>e.name),...IMP_SPECIAL])];
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
const yr4=y=>{y=+y;return y<100?2000+y:y};
const mkD=(y,mo,d)=>{if(mo<0||mo>11||d<1||d>31||y<2000||y>2100)return null;const x=new Date(y,mo,d);return x.getMonth()===mo?x:null};
function parseDateAny(v){
  if(v instanceof Date&&!isNaN(v)){const x=new Date(v.getTime()+12*3600e3);return new Date(x.getFullYear(),x.getMonth(),x.getDate())}
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(1899,11,30);d.setDate(d.getDate()+Math.floor(v));return d}return null}
  const s=String(v||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return mkD(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/)))return mkD(yr4(m[3]),+m[2]-1,+m[1]);
  if((m=s.match(/^(\d{1,2})[\s\-\/.]*([A-Za-z]{3,4})[a-z]*[\s\-\/.,]*(\d{2,4})\b/))&&MON[m[2].toLowerCase()]!==undefined)return mkD(yr4(m[3]),MON[m[2].toLowerCase()],+m[1]);
  if((m=s.match(/^([A-Za-z]{3,4})[a-z]*[\s\-.]+(\d{1,2}),?[\s\-.]+(\d{4})/))&&MON[m[1].toLowerCase()]!==undefined)return mkD(+m[3],MON[m[1].toLowerCase()],+m[2]);
  if(/^\d{5}$/.test(s))return parseDateAny(+s);
  return null;
}
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/).slice(0,15).join('\n'),cnt=c=>(first.match(new RegExp('\\'+c,'g'))||[]).length;
  const dl=[',',';','\t','|'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
    if(c==='"')q=true;else if(c===dl){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
const PAYEE_STOP=new Set('till india ltd pvt limited upi dr cr imps neft rtgs pos ach nach ecs mmt inb ib net banking netbanking transfer trf payment paid pay to from by via ref txn bil billpay p2a p2m vps collect request mob mobile hdfc icici sbi axis kotak yes yesb hdfcbank icic sbin utib kkbk pnb bob canara idfc indusind paytm ybl okaxis oksbi okhdfcbank okicici ibl axl apl ptys ptyes pytm na nil the and a c ac'.split(' '));
function cleanPayee(desc){
  const parts=String(desc||'').split(/[\/|:*@#]+|-+|\s{2,}/).map(x=>x.trim()).filter(Boolean);
  for(const p of parts){
    const seen=new Set(),toks=p.replace(/[^A-Za-z .&']/g,' ').split(/\s+/).filter(t=>{const l=t.toLowerCase();if(t.length<2||/^x+$/i.test(t)||PAYEE_STOP.has(l)||seen.has(l))return false;seen.add(l);return true});
    if(!toks.length||toks.join('').length<3)continue;
    return toks.slice(0,4).map(t=>t[0].toUpperCase()+t.slice(1).toLowerCase()).join(' ');
  }
  return String(desc||'Payment').slice(0,30);
}
const CAT_RULES=[[/swiggy|zomato|eatsure|domino|pizza|mcdonald|kfc|burger|restaurant|cafe|coffee|starbucks|chai|dhaba|biryani|bakery|haldiram|food/i,/eat|food|swiggy|zomato/i],[/bigbasket|blinkit|zepto|instamart|dmart|d mart|grocer|kirana|spencer|reliance fresh|reliance retail|more retail|jiomart|milk|dairy|vegetable|sabzi|fruit/i,/grocer|household/i],[/uber|\bola\b|rapido|petrol|fuel|hpcl|bpcl|iocl|indian ?oil|shell|metro|irctc|railway|fastag|parking|redbus|indigo|air ?india|akasa|makemytrip|goibibo|\bcab\b/i,/fuel|transport/i],[/amazon|flipkart|myntra|ajio|nykaa|meesho|decathlon|lifestyle|zara|h&m|westside|pantaloons|max fashion|croma|reliance digital|shopping/i,/shop|cloth/i],[/netflix|prime ?video|hotstar|spotify|bookmyshow|pvr|inox|cinepolis|youtube|movie|steam|playstation|gaana/i,/entertain|outing/i],[/salon|barber|\bspa\b|parlou?r|grooming|urban ?company|lakme|naturals/i,/care|groom/i],[/pharmacy|apollo|medplus|1mg|pharmeasy|netmeds|clinic|hospital|diagnostic|\blab\b|doctor|medical|chemist/i,/care|groom|health|medic/i],[/gift|ferns|archies|\bigp\b|donation|temple|mandir|puja/i,/gift|festival|misc/i],[/\bmom\b|mummy|\bmaa\b|papa|\bdad\b|bhaiya|didi|family/i,/family/i]];
function ruleCat(r){
  const D=(r.desc||'')+' '+(r.payee||'');
  if(r.dir==='in'){if(/salary|\bsal\b|payroll/i.test(D))return 'Salary (already counted)';if(/\bself\b|own a\/?c|sweep|fixed deposit|\bfd\b|\brd\b/i.test(D))return 'Transfer / ignore';return 'Income'}
  if(/self transfer|own a\/?c|own account|sweep|to fd|fd booking|rd instal|mutual fund|\bsip\b|zerodha|groww|upstox|kuvera|\bnps\b|\bppf\b/i.test(D))return 'Transfer / ignore';
  if(/\bemi\b|\bloan\b|\bnach\b|\bach d|\becs\b|bajaj fin|home credit|hdb fin/i.test(D))return 'EMI';
  if(/credit card|cred club|\bcred\b|cc payment|card payment|bbps|electricity|uppcl|lesa|mvvnl|broadband|recharge|insurance|premium|\blic\b|\brent\b|nagar nigam|house tax|jal kal|indane|\blpg\b|gas booking/i.test(D))return 'Bill payment';
  for(const [re,cre] of CAT_RULES)if(re.test(D)){const c=state.expenses.find(e=>cre.test(e.name));if(c)return c.name}
  return 'Other';
}
const BILL_SYN=[[/rent/i,['rent','landlord']],[/electric/i,['uppcl','lesa','mvvnl','electricity','power','bijli']],[/broadband|wi-?fi/i,['broadband','fiber','fibre','airtel','jio','excitel','bsnl','act fibernet']],[/mobile|recharge/i,['recharge','prepaid','postpaid','airtel','jio','vodafone']],[/lpg|gas/i,['lpg','indane','hp gas','bharat gas','gas booking']],[/ott|netflix|prime|hotstar/i,['netflix','hotstar','prime video','amazon prime','spotify','youtube','zee5','sonyliv']],[/gym|fitness/i,['gym','cult','fitness']],[/credit card/i,['credit card','cred','card payment','cc payment']],[/insurance|premium/i,['insurance','premium','lic','ergo','star health','care health','acko','policy']],[/house tax|nagar nigam|jal kal/i,['nagar nigam','house tax','jal kal','municipal']]];
function billKeys(b){const n=String(b.name||'').toLowerCase(),k=new Set(n.split(/[^a-z]+/).filter(w=>w.length>=4&&!['bill','payment','monthly','yearly','membership','tax','fee','fees','lucknow','india','house','home','service','charges','card','bank','nagar'].includes(w)));for(const [re,ws] of BILL_SYN)if(re.test(n))ws.forEach(w=>k.add(w));return [...k]}
function guessMethod(d){d=String(d||'');return /upi/i.test(d)?'UPI':/\bpos\b|card|ecom/i.test(d)?'Card':/atm|cash/i.test(d)?'Cash':/neft|imps|rtgs|\binb\b|\bib\b/i.test(d)?'Net banking':/nach|\bach\b|ecs|\bsi\b|autopay/i.test(d)?'Auto-debit':'UPI'}
function tableToRows(table){
  const rows=(table||[]).map(r=>(r||[]).map(c=>c instanceof Date||typeof c==='number'?c:String(c??'').trim()));
  let hi=-1,map=null;
  for(let i=0;i<Math.min(rows.length,80);i++){
    const low=rows[i].map(c=>typeof c==='string'?c.toLowerCase():'');
    const di=low.findIndex(c=>/date/.test(c)&&c.length<30),ni=low.findIndex(c=>/narration|description|particular|details|remarks/.test(c));
    if(di<0||ni<0)continue;
    const dr=low.findIndex(c=>/withdraw|debit|\bdr\b|paid out/.test(c)&&!/date|card/.test(c)),cr=low.findIndex(c=>/deposit|credit|\bcr\b|paid in/.test(c)&&!/date|card/.test(c));
    const am=low.findIndex(c=>/amount/.test(c)&&!/balance/.test(c)),ty=low.findIndex(c=>/dr\s*\/\s*cr|cr\s*\/\s*dr|^type$|debit\s*\/\s*credit/.test(c));
    if(dr<0&&cr<0&&am<0)continue;
    const dt=low.findIndex(c=>/(txn|transaction|tran)\.?\s*date/.test(c));
    hi=i;map={d:dt>=0?dt:di,n:ni,dr,cr,am,ty};break;
  }
  if(hi<0)return [];
  const N=x=>typeof x==='number'?x:num(String(x??'').replace(/[,₹\s]|rs\.?|inr/gi,'').replace(/(cr|dr)\.?$/i,''));
  const body=rows.slice(hi+1),signed=map.am>=0&&map.ty<0&&body.some(r=>N(r[map.am])<0);
  const out=[];
  for(const r of body){
    const d=parseDateAny(r[map.d]);if(!d)continue;
    const desc=String(r[map.n]??'').replace(/\s+/g,' ').trim();let amt=0,dir='out';
    if(map.dr>=0||map.cr>=0){const a=map.dr>=0?Math.abs(N(r[map.dr])):0,b=map.cr>=0?Math.abs(N(r[map.cr])):0;if(a>0){amt=a;dir='out'}else if(b>0){amt=b;dir='in'}}
    if(!amt&&map.am>=0){const raw=r[map.am],v=N(raw);amt=Math.abs(v);const t=(map.ty>=0?String(r[map.ty]):String(raw)).toLowerCase();dir=/\bcr\b|credit|deposit/.test(t)?'in':/\bdr\b|debit|withdraw/.test(t)?'out':signed?(v<0?'out':'in'):'out'}
    if(!amt)continue;
    out.push({date:ds(d),desc,payee:cleanPayee(desc),amount:Math.round(amt*100)/100,dir});
  }
  return out;
}
function finalizeRows(rows){
  const incomes=state.income.map(x=>num(x.amount)).filter(x=>x>=5000);
  return rows.filter(r=>{const d=parseDateAny(r.date);if(!d||!(num(r.amount)>0))return false;r.date=ds(d);r.amount=Math.round(num(r.amount)*100)/100;return true}).map(r=>{
    r.desc=r.desc||'';r.payee=r.payee||cleanPayee(r.desc);if(!r.cat)r.cat=ruleCat(r);
    const D=(r.desc+' '+r.payee).toLowerCase();
    if(r.dir==='in'&&r.cat==='Income'&&incomes.some(x=>Math.abs(r.amount-x)<=x*.15)&&/salary|sal|neft|imps|payroll/i.test(D))r.cat='Salary (already counted)';
    if(r.dir==='out'){
      const loan=state.loans.filter(l=>num(l.emi)>0).map(l=>({l,diff:Math.abs(r.amount-num(l.emi))/num(l.emi)})).filter(x=>x.diff<=.03).sort((a,b)=>a.diff-b.diff)[0];
      if(loan&&(r.cat==='EMI'||/emi|loan|nach|ach|ecs|si\b/i.test(D))){r.cat='EMI';r.loan=loan.l.id}
      if(!r.loan){const bill=state.bills.find(b=>{const amt=num(b.amount);return billKeys(b).some(k=>D.includes(k))&&(!amt||Math.abs(r.amount-amt)<=Math.max(60,amt*.3))});if(bill&&(r.cat==='Bill payment'||r.cat==='Other'||/bill|recharge|premium|rent/i.test(D))){r.cat='Bill payment';r.bill=bill.id}}
    }
    r.dup=state.tx.some(t=>t.date===r.date&&Math.abs(num(t.amount)-r.amount)<1&&(t.dir==='in'?'in':'out')===r.dir);

function habitLogSync(h,on,dateKey=ds(today())){
  if(!h||!h.auto)return;
  const L=state.health.logs[dateKey]=state.health.logs[dateKey]||{},P=L._prev=L._prev||{};
  const F={steps:['steps',10000],water:['water',12],sleep:['sleep',7]}[h.auto];if(!F)return;
  const [k,full]=F;
  if(on){if(num(L[k])<full){P[k]=num(L[k]);L[k]=full}}

}

function pickFile(accept,capture){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept=accept;if(capture)i.setAttribute('capture','environment');
    i.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(i);
    let done=false;const fin=f=>{if(done)return;done=true;res(f);setTimeout(()=>i.remove(),2000)};
    i.addEventListener('change',()=>fin(i.files&&i.files[0]||null));i.addEventListener('cancel',()=>fin(null));
    i.click();
  });
}

async function fileText(text){

  if(document.body.classList.contains('locked'))return;
  document.body.classList.toggle('collapsed',!!ui.collapsed);
  if(!PAGES[ui.page])ui.page='overview';
  renderShell();if(scryOpen)runSearch(scryQ);
  const main=$('#main');
  main.innerHTML=PAGES[ui.page]()+`<p class="foot">${esc(state.profile.name)} · saved in this browser${storageOK?'':' — <span class="neg">storage blocked, export a backup</span>'}</p>`;
  const animate=pageChanged&&!RM();
  main.classList.toggle('anim',animate);$('#side').classList.toggle('anim-side',animate);
  if(animate){
    let i=0;main.querySelectorAll('.card,.kpi,.banner,.phead,.logt').forEach(el=>el.style.setProperty('--i',Math.min(i++,18)));
    main.querySelectorAll('.card,.kpi').forEach(c=>{let j=0;c.querySelectorAll('.gbar,.segbar').forEach(g=>g.style.setProperty('--i',Math.min(+c.style.getPropertyValue('--i')+j++,22)))});
    main.querySelectorAll('svg.chart').forEach(sv=>sv.querySelectorAll('rect').forEach((r,j)=>r.style.setProperty('--b',Math.floor(j/Math.max(1,sv.dataset.k||1)))));
    const h1=main.querySelector('.phead h1');if(h1&&!h1.children.length)h1.innerHTML=h1.textContent.split(' ').map((w,k)=>`<span class="w" style="--w:${k}">${esc(w)}</span>`).join(' ');
    countUp(main);
  }
  pageChanged=false;justId=null;
  if(location.hash!=='#/'+ui.page)history.replaceState(null,'','#/'+ui.page);
  document.title=(ui.page==='overview'?'':({notes:'Notes',notify:'Notifications',goals:'Goals',reminders:'Reminders',health:'Health',grooming:'Grooming',checklist:'Checklist',activity:'Activity',budget:'Budget',bills:'Bills',debt:'Debt',savings:'Savings',year:'Year summary',settings:'Settings'}[ui.page]+' · '))+"Self Streak";
  saveUI();
}
function go(p){const [pg,v]=String(p).split(':');if(scryOpen)closeScry();pageChanged=pg!==ui.page||!!v||pageChanged;ui.page=pg;if(v)ui.remView=v;menu=null;document.body.classList.remove('navopen');render();window.scrollTo(0,0)}

/* ================= search (Scry: icon slides open into a field, becomes a close button) ================= */
let scryOpen=false,scryQ='',sHits=[];
function openScry(){
  if(menu){menu=null;renderShell()}
  const el=$('#scry');if(!el)return;scryOpen=true;void el.offsetWidth;el.classList.add('open');
  el.querySelector('.scry-btn').setAttribute('aria-label','Close search');
  if(!$('#sres')){const d=document.createElement('div');d.className='pop wide scry-res';d.id='sres';el.appendChild(d)}
  runSearch(scryQ);setTimeout(()=>$('#scryIn')?.focus(),RM()?0:180);
}
function closeScry(){scryOpen=false;scryQ='';const el=$('#scry');if(!el)return;el.classList.remove('open');const i=$('#scryIn');i.value='';i.blur();$('#sres')?.remove();el.querySelector('.scry-btn').setAttribute('aria-label','Search')}
function runSearch(q){
  const box=$('#sres');if(!box)return;q=q.trim().toLowerCase();const H=[];
  const add=(grp,label,sub,act)=>{if(!q||(label+' '+sub).toLowerCase().includes(q))H.push({grp,label,sub,act})};
  NAV.flatMap(n=>n[1]).forEach(([k,l])=>add('Pages',l,'',{go:k}));
  if(q){
    state.reminders.forEach(r=>add('Reminders',r.title,r.type+(r.date?' · '+fmt(pd(r.date),{day:'numeric',month:'short'}):''),{go:'reminders',edit:['reminders',r.id]}));
    state.bills.forEach(b=>add('Bills',b.name,inr(b.amount)+' · '+b.freq,{go:'bills',edit:['bills',b.id]}));
    state.goals.forEach(g=>add('Goals',g.title,g.category,{go:'goals',edit:['goals',g.id]}));
    state.loans.forEach(l=>add('Loans',l.name,inr(l.outstanding)+' left',{go:'debt',edit:['loans',l.id]}));
    state.savings.forEach(x=>add('Savings',x.name,inr(x.current),{go:'savings',edit:['savings',x.id]}));
    state.tx.forEach(t=>add('Payments',t.payee,`${inr(t.amount)} · ${t.category} · ${fmt(pd(t.date),{day:'numeric',month:'short'})}`,{go:'activity',edit:['tx',t.id]}));
    state.health.habits.forEach(h=>add('Habits',h.name,h.period,{go:h.area==='Grooming'?'grooming':'health',edit:['habits',h.id]}));
    state.checklist.forEach(c=>add('Checklist',c.item,c.area,{go:'checklist',edit:['checklist',c.id]}));
    state.grooming.products.forEach(x=>add('Grooming',x.name,x.category,{go:'grooming',edit:['products',x.id]}));
  }
  sHits=H.slice(0,40);let last='';
  box.innerHTML=sHits.map((h,i)=>{const g=h.grp!==last?`<div class="grp">${h.grp}</div>`:'';last=h.grp;return g+`<button class="mi" data-hit="${i}"><span>${esc(h.label)}</span><small>${esc(h.sub)}</small></button>`}).join('')||'<div class="empty">No matches.</div>';
}
function pickHit(i){const h=sHits[i];if(!h)return;closeScry();go(h.act.go);if(h.act.edit)openForm(h.act.edit[0],h.act.edit[1])}

/* Lumen: theme switch with a circle reveal from the button */
function lumen(btn){
  const cur=document.documentElement.dataset.theme,isLight=cur==='light'||(cur==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);
  const apply=()=>{state.profile.theme=isLight?'dark':'light';save();render()};
  if(!document.startViewTransition||RM()){apply();return}
  const [x,y]=center(btn),r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:720,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
}

/* ================= export / import ================= */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function fold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=' '+l.slice(73)}out.push(l);return out.join('\r\n')}
function exportICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Self Streak//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Self Streak'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const add=(id,date,title,desc,rrule,lead)=>{const d=ds(date).replace(/-/g,''),e=ds(addDays(date,1)).replace(/-/g,'');const trig=lead>0?`-PT${lead*24-9}H`:'PT9H';
    L.push('BEGIN:VEVENT','UID:'+id+'@selfstreak','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+icsEsc(title));
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(rrule)L.push('RRULE:'+rrule);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+trig,'END:VALARM','END:VEVENT')};
  const RR={weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',quarterly:'FREQ=MONTHLY;INTERVAL=3','half-yearly':'FREQ=MONTHLY;INTERVAL=6',yearly:'FREQ=YEARLY'};
  let n=0;const t=today();
  for(const r of state.reminders){if(!r.date)continue;add(r.id,pd(r.date),r.title,(r.notes||'')+(r.amount?` Amount: ₹${r.amount}`:''),RR[r.repeat]||'',num(r.lead));n++}
  for(const b of state.bills){const nd=nextBillDate(b);if(!nd)continue;add('bill-'+b.id,nd,`Pay: ${b.name}${num(b.amount)?' (₹'+num(b.amount).toLocaleString('en-IN')+')':''}`,b.notes||'',RR[b.freq]||'FREQ=MONTHLY',2);n++}
  for(const l of state.loans){if(num(l.outstanding)<=0||num(l.emi)<=0)continue;const s=loanSim(l),nd=monthlyOcc(2000,0,num(l.dueDay)||1,1,t,addDays(t,40),null)[0];if(!nd)continue;add('emi-'+l.id,nd,`EMI: ${l.name} (₹${num(l.emi).toLocaleString('en-IN')})`,l.lender||'','FREQ=MONTHLY'+(isFinite(s.n)?';COUNT='+s.n:''),2);n++}
  L.push('END:VCALENDAR');download('self-streak-reminders.ics',L.map(fold).join('\r\n'),'text/calendar');
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Date','Payee','Category','Direction','Amount','Method','Note'],...[...state.tx].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>[t.date,t.payee,t.dir==='in'?'Income':t.category,t.dir==='in'?'in':'out',t.amount,t.method,t.note])];
  download(`payments-${ds(today())}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function clearSamples(){
  if(!confirm('Remove all sample income, budget categories, bills, loans, savings and payments? Anything you’ve edited stays.'))return;
  for(const k of ['income','expenses','bills','loans','savings','tx'])state[k]=state[k].filter(x=>!x.sample);
  commit();
}

  const el=e.target,d=el.dataset;
  if(el.closest('#dlg'))return;
  if(d.ui){const k=d.ui;ui[k]=['year','ovRange','whereM'].includes(k)?+el.value:k==='extra'?num(el.value):el.value;render();return}
  if(d.log){const k=ds(today()),lg=state.health.logs[k]=state.health.logs[k]||{};lg[d.log]=el.value===''?'':num(el.value);autoHabits();commit();return}
  if(d.month){const o=state.months[d.month]=state.months[d.month]||{};o[d.mk]=el.value===''?'':num(el.value);commit();return}
  if(d.prof){state.profile[d.prof]=['age','proteinTarget','kcalTarget'].includes(d.prof)?num(el.value):el.value;commit();return}
  if(d.groom){state.grooming[d.groom]=d.groom==='cutEvery'?num(el.value):el.value;commit();return}
  if(d.nzv){const v=d.nzv.endsWith('dow')?num(el.value):el.value;if(!d.nzv.endsWith('dow')&&!/^\d{2}:\d{2}$/.test(v))return;setNz(d.nzv,v);commit();return}
  if(d.lstart){const l=state.loans.find(x=>x.id===d.lstart);if(l&&el.value){l.startDate=el.value;delete l.sample;commit();toast('First EMI date saved','calendar')}return}
  if(d.nzt){setNz(d.nzt,parseTimes(el.value));commit();toast('Times updated','clock');return}
  if(d.nzti){const [path,k]=d.nzti.split(':'),arr=path.split('.').reduce((o,x)=>o[x],state.nudges);if(!/^\d{2}:\d{2}$/.test(el.value))return;arr[+k]=el.value;setNz(path,parseTimes(arr.join(',')));commit();return}
  if(d.hti){const [id,k]=d.hti.split(':'),h=state.health.habits.find(x=>x.id===id);if(h&&/^\d{2}:\d{2}$/.test(el.value)){h.times[+k]=el.value;h.times=parseTimes(h.times.join(','));ui.nzOpen=true;nzCache.t=0;commit()}return}
  if(d.ht){const h=state.health.habits.find(x=>x.id===d.ht);if(h){h.times=parseTimes(el.value);commit()}return}
  if(d.hdow){const h=state.health.habits.find(x=>x.id===d.hdow);if(h){h.dow=num(el.value);commit()}return}
  if(d.hdom){const h=state.health.habits.find(x=>x.id===d.hdom);if(h){h.dom=Math.max(1,Math.min(28,num(el.value)||1));commit()}return}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='pwform')return;e.preventDefault();const f=e.target,msg=$('#pwmsg');
  try{await apiFetch('/api/password',{method:'POST',body:{current:f.cur.value,next:f.nw.value}});f.reset();msg.textContent='Password changed.';msg.className='small pos'}catch(x){msg.textContent=x.message;msg.className='small neg'}
});
let qT;
document.addEventListener('input',e=>{if(e.target.id==='scryIn'){scryQ=e.target.value;runSearch(scryQ);return}const d=e.target.dataset;if(d.ui==='txQ'||d.ui==='remQ'){clearTimeout(qT);const k=d.ui,v=e.target.value;qT=setTimeout(()=>{ui[k]=v;render();const inp=document.querySelector(`[data-ui="${k}"]`);if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}},250)}});
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('locked'))return;
  if(e.target.id==='scryIn'){if(e.key==='Escape'){e.preventDefault();closeScry()}else if(e.key==='Enter'){e.preventDefault();pickHit(0)}return}
  const typing=e.target.matches('input,textarea,select');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();scryOpen?closeScry():openScry();return}
  if(typing){if(e.key==='Enter'&&e.target.matches('input[data-log],input[data-month],input[data-ui="extra"],input[data-prof]'))e.target.blur();return}
  if($('#dlg').open||$('#voice').open||$('#asst').open)return;
  if(e.key==='/'){e.preventDefault();openScry()}
  else if(e.key.toLowerCase()==='v'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openAssistant('mic')}
  else if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openForm('tx',null,{date:ds(today()),dir:'out',method:'UPI'})}
  else if(e.key==='Escape'&&menu){menu=null;renderShell()}
});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#/','');if(PAGES[p]&&p!==ui.page)go(p)});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!s.reminders||!s.health)throw 0;if(confirm('Replace all current data with this backup?')){localStorage.setItem(KEY,JSON.stringify(s));state=load();commit()}}catch(err){alert('That file doesn’t look like a backup from this dashboard.')}e.target.value=''};
  rd.readAsText(f);
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>render());

{const p=location.hash.replace('#/','');if(PAGES[p])ui.page=p}
{const q=new URLSearchParams(location.search);if(q.get('do')){pendingDo=q.get('do');history.replaceState(null,'',location.pathname+location.hash)}}
function afterOpen(){if(pendingDo){const a=pendingDo;pendingDo=null;setTimeout(()=>runDo(a),400)}setTimeout(checkMissed,1500)}
$('#dlg').addEventListener('close',()=>{if(imp){imp=null}$('#dlg').classList.remove('wide')});
$('#voice').addEventListener('close',onNotesClose);
$('#asst').addEventListener('close',()=>{clearTimeout(asSil);AS.listening=false;try{asRec?.abort()}catch(e){}});
$('#asst').addEventListener('click',e=>{if(e.target===$('#asst'))closeDlg($('#asst'))});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('hcard')){ui.nzOpen=e.target.open;saveUI()}},true);
$('#voice').addEventListener('click',e=>{if(e.target===$('#voice'))closeDlg($('#voice'))});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){await pullCloud();nzCache.t=0;notifTick();checkMissed()}});
boot();
initPWA();setInterval(notifTick,20000);setTimeout(notifTick,3000);
</script>
