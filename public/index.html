/* ================= finance math ================= */
const billMonthly=b=>num(b.amount)/(STEP[b.freq]||1);
function billDueIn(b,y,m){const st=STEP[b.freq]||1;if(st===1)return true;return (((m-num(b.startMonth))%st)+st)%st===0}
function loanSim(l){
  let b=num(l.outstanding);const r=num(l.rate)/1200,e=num(l.emi);let n=0,int=0;
  if(b<=0)return {n:0,int:0};if(e<=0||e<=b*r)return {n:Infinity,int:Infinity};
  while(b>0.5&&n<600){const i=b*r;int+=i;b=b+i-Math.min(e,b+i);n++}
  return {n,int};
}
function simulate(extra,strategy,rollover){
  const ls=state.loans.filter(l=>num(l.outstanding)>0&&num(l.emi)>0).map(l=>({id:l.id,name:l.name,b:num(l.outstanding),r:num(l.rate)/1200,emi:num(l.emi),done:0}));
  if(!ls.length)return {months:0,interest:0,order:[],stuck:false};
  let m=0,interest=0;const order=[];
  while(ls.some(l=>l.b>0.5)&&m<600){
    m++;let pool=extra;
    for(const l of ls){
      if(l.b<=0.5){if(rollover)pool+=l.emi;continue}
      const i=l.b*l.r;interest+=i;l.b+=i;const pay=Math.min(l.emi,l.b);l.b-=pay;
      if(rollover&&pay<l.emi)pool+=l.emi-pay;
      if(l.b<=0.5&&!l.done){l.done=m;order.push(l)}
    }
    while(pool>0.5){
      const open=ls.filter(l=>l.b>0.5);if(!open.length)break;
      open.sort(strategy==='snowball'?(a,b)=>a.b-b.b:(a,b)=>b.r-a.r);
      const t=open[0],p=Math.min(pool,t.b);t.b-=p;pool-=p;
      if(t.b<=0.5&&!t.done){t.done=m;order.push(t)}
    }
  }
  return {months:m,interest,order,stuck:m>=600};
}
const txIn=(y,m)=>state.tx.filter(t=>t.date&&pd(t.date).getFullYear()===y&&pd(t.date).getMonth()===m);
const txOut=(y,m)=>sum(txIn(y,m).filter(t=>t.dir!=='in'),t=>t.amount);
const txInc=(y,m)=>sum(txIn(y,m).filter(t=>t.dir==='in'),t=>t.amount);
function fin(){
  const income=sum(state.income,x=>x.amount),bills=sum(state.bills,billMonthly);
  const active=state.loans.filter(l=>num(l.outstanding)>0);
  const emi=sum(active,l=>l.emi),spend=sum(state.expenses,x=>x.amount);
  const out=bills+emi+spend,left=income-out,debt=sum(active,l=>l.outstanding);
  const assets=sum(state.savings,s=>s.current);
  const ef=sum(state.savings.filter(s=>s.type==='Emergency fund'),s=>s.current);
  const needs=bills+emi+sum(state.expenses.filter(e=>e.kind!=='want'),e=>e.amount);
  const wants=sum(state.expenses.filter(e=>e.kind==='want'),e=>e.amount);
  return {income,bills,emi,spend,out,left,rate:income?left/income:NaN,debt,assets,net:assets-debt,emiRatio:income?emi/income:NaN,ef,efMonths:out?ef/out:0,needs,wants};
}
const loanOff=l=>{const t=today();let o=state.paid['L:'+l.id+'|'+ym(t.getFullYear(),t.getMonth())]?1:0;if(l.startDate){const sd=pd(l.startDate),m=(sd.getFullYear()-t.getFullYear())*12+(sd.getMonth()-t.getMonth());if(m>0)o-=m}return o};
function loanEmiInMonth(l,y,m){
  const e=num(l.emi);if(!e)return 0;
  const mEnd=new Date(y,m+1,0),t=today();
  if(l.startDate&&pd(l.startDate)>mEnd)return 0;
  const diff=(y-t.getFullYear())*12+(m-t.getMonth());
  if(diff<0)return e;
  return diff-loanOff(l)<loanSim(l).n?e:0;
}
// First month the user actually tracked: account creation, earliest real payment, or earliest typed-in month.
function trackStart(){
  let t=account?.user?.created?new Date(account.user.created):today();
  for(const x of state.tx)if(!x.sample&&x.date){const d=pd(x.date);if(d<t)t=d}
  for(const k in state.months){const o=state.months[k];if((o.income!==undefined&&o.income!=='')||(o.spent!==undefined&&o.spent!=='')){const [yy,mm]=k.split('-').map(Number);const d=new Date(yy,mm-1,1);if(d<t)t=d}}
  return new Date(t.getFullYear(),t.getMonth(),1);
}
function monthRow(y,m){
  const key=ym(y,m),o=state.months[key]||{};
  if(new Date(y,m,1)<trackStart()&&!(o.income!==undefined&&o.income!=='')&&!(o.spent!==undefined&&o.spent!==''))

/* ================= reminders engine ================= */
function monthlyOcc(baseY,baseM,day,step,from,to,minDate){
  const out=[];let y=from.getFullYear(),m=from.getMonth();
  while(new Date(y,m,1)<=to){
    const diff=(y-baseY)*12+(m-baseM);
    if(((diff%step)+step)%step===0){const d=new Date(y,m,Math.min(day,dim(y,m)));if(d>=from&&d<=to&&(!minDate||d>=minDate))out.push(d)}
    if(++m>11){m=0;y++}
  }
  return out;
}
function eventsBetween(from,to){
  cardSyncPaid();const ev=[],ty=today().getFullYear();
  for(const r of state.reminders){
    if(!r.date)continue;
    const b=pd(r.date);let dates=[];const rep=r.repeat||'none';
    if(rep==='none'){if(b>=from&&b<=to)dates=[b]}
    else if(rep==='weekly'){const k=Math.max(0,Math.ceil(daysBetween(b,from)/7));for(let d=addDays(b,k*7);d<=to;d=addDays(d,7))dates.push(d)}
    else dates=monthlyOcc(b.getFullYear(),b.getMonth(),b.getDate(),STEP[rep]||12,from,to,b);
    for(const d of dates){
      let extra='';
      if(rep==='yearly'&&(r.type==='Birthday'||r.type==='Anniversary')&&b.getFullYear()<=ty-2){const n=d.getFullYear()-b.getFullYear();extra=r.type==='Birthday'?`turns ${n}`:`${n} years`}
      ev.push({date:d,title:r.title,type:r.type||'Other',amount:num(r.amount),src:'reminder',id:r.id,notes:r.notes,extra,lead:num(r.lead)});
    }
  }
  for(const b of state.bills){
    const st=STEP[b.freq]||1;
    for(const d of monthlyOcc(2000,st===1?0:num(b.startMonth),num(b.dueDay)||1,st,from,to,null))
      ev.push({date:d,title:b.name,type:'Bill/Payment',amount:num(b.amount),src:'bill',id:b.id,notes:b.notes,extra:b.autopay?'autopay':'',lead:2});
  }
  const t=today();
  for(const l of state.loans){
    if(num(l.outstanding)<=0||num(l.emi)<=0)continue;
    const n=loanSim(l).n,start=l.startDate?pd(l.startDate):null;
    for(const d of monthlyOcc(2000,0,num(l.dueDay)||1,1,from,to,start)){
      const diff=(d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth());
      if(diff>=0&&isFinite(n)&&diff-loanOff(l)>=n)continue;
      ev.push({date:d,title:l.name+' EMI',type:'EMI',amount:num(l.emi),src:'loan',id:l.id,notes:l.lender,extra:'',lead:2});
    }
  }
  ev.push(...cardEvents(from,to));
  return ev.sort((a,b)=>a.date-b.date||a.title.localeCompare(b.title));
}

function lateThisMonth(){const t=today();return eventsBetween(new Date(t.getFullYear(),t.getMonth(),1),addDays(t,-1)).filter(e=>(e.src==='bill'||e.src==='loan'||e==='card')&&num(e.amount)>0&&e.extra!=='autopay'&&!state.paid[paidKey(e)])}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return `${y}-W${pad(Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7))}`}

function goalProg(g){
  let cur=num(g.current),tgt=num(g.target);
  if(g.link==='debt'){const P=sum(state.loans,l=>Math.max(num(l.principal),num(l.outstanding)));cur=P-sum(state.loans,l=>l.outstanding);tgt=P}
  else if(g.link==='emergency'){const f=fin();cur=f.ef;tgt=tgt||Math.round(f.out*6)}

function nice(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(labels,series,mode,H=230){
  const W=640,pl=46,pr=6,pt=8,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const all=series.flatMap(s=>s.values);let mx=Math.max(1,...all),mn=Math.min(0,...all);

  const y=v=>pt+ih-(v-mn)/(mx-mn)*ih;

  const n=labels.length,bw=iw/n;let body='';

      body+=`<path class="ln" pathLength="1" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" style="fill:none;stroke:${s.color};stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--card);stroke:${s.color};stroke-width:2"><title>${labels[i]} · ${s.name}: ${inr(s.values[i])}</title></circle>`).join('');}
  }else{

      body+=`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2)}" style="fill:${s.color}"><title>${labels[i]} · ${s.name}: ${inr(v)}</title></rect>`}));

function pDebt(){

  const dfd=m=>m?fmt(addMonths(t,m),{month:'short',year:'numeric'}):'Debt-free';
  const cards=[...state.loans].sort((a,b)=>num(b.rate)-num(a.rate)).map(l=>{
    const s=loanSim(l),pr=Math.max(num(l.principal),num(l.outstanding)),pp=pr?1-num(l.outstanding)/pr:0,r=num(l.rate);
    const pk=`L:${l.id}|${ym(t.getFullYear(),t.getMonth())}`,paid=state.paid[pk];

    <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px">

    ${!isFinite(s.n)&&num(l.outstanding)>0?'<p class="small neg" style="margin-top:10px">The EMI doesn’t cover the monthly interest, so the balance keeps growing.</p>':''}
    <div class="inline small" style="margin-top:12px;gap:8px;flex-wrap:wrap"><span class="muted">First EMI</span>${l.startDate&&ui.lsEdit!==l.id?`<b>${fmt(pd(l.startDate),{day:'numeric',month:'short',year:'numeric'})}</b>${pd(l.startDate)>t?' <span class="pill cyan nodot">starts later</span>':''}<button class="link tiny" data-lsedit="${l.id}">Change</button>`:`<input type="date" class="sel" id="ls-${l.id}" value="${esc(l.startDate||'')}" aria-label="First EMI date" style="height:32px"><button class="btn sm lime" data-lsave="${l.id}">Save</button>${l.startDate?`<button class="btn sm ghost" data-lsedit="">Cancel</button>`:'<span class="tiny muted" style="flex-basis:100%">Pick the date, then tap Save.</span>'}`}</div>

function pReminders(){

  const filt=e=>(ui.remType==='All'||e.type===ui.remType)&&(!q||e.title.toLowerCase().includes(q));
  const evs=eventsBetween(from,to).filter(filt),t=today(),noDate=state.reminders.filter(r=>!r.date);
  const up=eventsBetween(t,addDays(t,30)).filter(filt);
  let view='';
  if(ui.remView==='calendar'){
    const byDay={};for(const e of evs)(byDay[ds(e.date)]=byDay[ds(e.date)]||[]).push(e);
    const months=[...Array(12)].map((_,m)=>{const off=(new Date(y,m,1).getDay()+6)%7,n=dim(y,m);let cells='';for(let i=0;i<off;i++)cells+='<span class="day empty"></span>';
      for(let d=1;d<=n;d++){const k=ds(new Date(y,m,d)),es=byDay[k]||[],tps=[...new Set(es.map(e=>e.type))].slice(0,3);
        cells+=`<button class="day ${k===ds(t)?'today':''} ${k===ui.dayPick?'sel':''}" data-day="${k}" title="${es.map(e=>esc(e.title)).join('\n')}">${d}<span class="dots">${tps.map(tp=>`<i style="background:${tcol(tp)}"></i>`).join('')}</span></button>`}

  }else if(ui.remView==='list'){
    view=`<div class="card">${MONTHS_FULL.map((mn,m)=>{const es=evs.filter(e=>e.date.getMonth()===m);return es.length?`<div class="dayhead"><span>${mn} ${y}</span><span>${es.length} items${sum(es,e=>e.amount)?' · '+inr(sum(es,e=>e.amount)):''}</span></div>${es.map(evRow).join('')}`:''}).join('')||'<div class="empty">No reminders match.</div>'}</div>`;
  }else{
    const rl={none:'Once',yearly:'Yearly',monthly:'Monthly',quarterly:'Every 3 months','half-yearly':'Every 6 months',weekly:'Weekly'};

  }
  return `${phead('Life · The whole year','Reminders',`${yearSel()}<button class="btn" data-act="ics">${ic('calendar')} Add to phone calendar</button><button class="btn lime" data-add="reminders">${ic('plus')} Add reminder</button>`)}
  <div class="stack">
  <div class="inline"><div class="seg">${[['calendar','Calendar'],['list','Year list'],['manage','All reminders']].map(([v,l])=>`<button class="${ui.remView===v?'on':''}" data-set="remView:${v}">${l}</button>`).join('')}</div>

  <div class="chips">${['All',...REM_TYPES,'EMI'].map(tp=>`<button class="chip ${ui.remType===tp?'on':''}" data-set="remType:${tp}">${tp!=='All'?`<span style="color:${tcol(tp)}">●</span> `:''}${tp}</button>`).join('')}</div>
  ${noDate.length&&ui.remView!=='manage'?`<div class="banner">${ic('calendar')}<span><b>${noDate.length} reminders need a date:</b> ${noDate.slice(0,5).map(r=>esc(r.title)).join(', ')}${noDate.length>5?'…':''}</span><span class="sp"></span><button class="btn sm" data-set="remView:manage">Set dates</button></div>`:''}
  ${y===t.getFullYear()&&ui.remView!=='manage'?`<div class="card"><div class="ch"><div><h3>Coming up</h3><div class="sub">Next 30 days</div></div></div>${up.slice(0,8).map(evRow).join('')||'<div class="empty">Nothing coming up.</div>'}</div>`:''}

/* ---- health helpers (Halvi dial & bars, Cairnly streak, heatmap & cairn) ---- */
const dailyHabits=()=>state.health.habits.filter(h=>h.period==='daily');
function dayRatio(d){const hs=dailyHabits();if(!hs.length)return 0;const c=state.health.checks[periodKey('daily',d)]||{};return hs.filter(h=>c[h.id]).length/hs.length}
function fullStreak(){const t=today();let cur=0,d=t;if(dayRatio(d)<.8)d=addDays(d,-1);while(dayRatio(d)>=.8&&cur<3650){cur++;d=addDays(d,-1)}
  let best=0,run=0;for(let i=365;i>=0;i--){if(dayRatio(addDays(t,-i))>=.8){run++;best=Math.max(best,run)}else run=0}return {cur,best:Math.max(best,cur)}}

function dial(score){const N=48,on=Math.round(score/100*N);let s='';
  for(let i=0;i<N;i++){const a=(135+i*270/(N-1))*Math.PI/180,c=Math.cos(a),n=Math.sin(a),col=i<on?`color-mix(in srgb,var(--cyan) ${Math.round(100-i/(N-1)*100)}%,var(--lime))`:'var(--line)';
    s+=`<line class="${i<on?'on':''}" style="--t:${i};stroke:${col}" x1="${(100+c*66).toFixed(1)}" y1="${(100+n*66).toFixed(1)}" x2="${(100+c*88).toFixed(1)}" y2="${(100+n*88).toFixed(1)}"/>`}
  return `<div class="dial"><svg viewBox="0 0 200 200" role="img" aria-label="Score ${score} out of 100">${s}</svg><div class="dv"><div><div class="dn">${score}</div><div class="tiny muted">out of 100</div></div></div></div>`}

  const W=640,H=220,pl=6,pr=6,pt=22,pb=26,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(12000,...steps)*1.08,bw=iw/days.length,Y=v=>pt+ih-v/mx*ih;
  let s='';days.forEach((d,i)=>{const v=steps[i],x=pl+i*bw+bw*.18,w=bw*.64,h=Math.max(v/mx*ih,4),isT=i===days.length-1;
    s+=`<rect class="b" style="--b:${i};fill:${isT?'var(--lime)':v>=10000?'url(#hatchL)':'url(#hatch)'};stroke:${isT?'none':v>=10000?'color-mix(in srgb,var(--lime) 55%,transparent)':'var(--line2)'}" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(12,w/2).toFixed(1)}"><title>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: ${v.toLocaleString('en-IN')} steps</title></rect>`;

    if(isT&&v)s+=`<text x="${(x+w/2).toFixed(1)}" y="${(pt+ih-h-7).toFixed(1)}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v>=1000?(v/1000).toFixed(1)+'k':v}</text>`});
  const gy=Y(10000);s+=`<line x1="${pl}" x2="${W-pr}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:5 6"/><rect x="${W-pr-46}" y="${gy-10}" width="44" height="20" rx="10" style="fill:var(--card2);stroke:var(--line2)"/><text x="${W-pr-24}" y="${gy+4}" text-anchor="middle" style="fill:var(--text);font-weight:600">10k</text>`;

/* ================= Self Streak: account, cloud sync, AI via server ================= */
const BRAND='Self Streak';
let cloudBase=0,syncFail=0;
let account=null,usage={used:0,limit:100},cloudT=null,cloudDirty=false,pushOn=false,authMode='login';
async function apiFetch(path,opts={}){
  const r=await fetch(path,{method:opts.method||'GET',headers:opts.body!==undefined?{'content-type':'application/json'}:{},body:opts.body!==undefined?JSON.stringify(opts.body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error&&!/^[a-z_]+$/.test(d.error)?d.error:'Something went wrong. Please try again.');e.status=r.status;e.data=d;throw e}
  return d;
}
function queueCloud(now){
  if(!account)return;cloudDirty=true;clearTimeout(cloudT);
  cloudT=setTimeout(async()=>{if(!navigator.onLine)return;try{const u=state._u||Date.now(),r=await apiFetch('/api/data',{method:'PUT',body:{data:state,updated:u,base:cloudBase}});cloudBase=r.updated||u;cloudDirty=false;syncFail=0}
    catch(e){if(e.status===401)showAuth('login','Your session ended. Please log in again.');else if(e.status===409&&e.data?.data)adoptCloud(e.data.data,e.data.updated,true);else if(++syncFail<6)setTimeout(()=>queueCloud(true),15000*syncFail);else toast('Couldn’t sync to the cloud. Your changes are safe on this device.','x')}},now?10:1500);
}
function adoptCloud(data,updated,conflict){
  const fired=state.nudges?.fired||{};state=load(data);state.nudges.fired={...state.nudges.fired,...fired};cloudBase=updated;cloudDirty=false;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  nzCache.t=0;autoHabits();if(!document.body.classList.contains('locked')){render();syncSW();pushSchedule()}
  if(conflict)toast('Updated with changes from your other device','tick');
}
let pulling=false;
async function pullCloud(){
  if(!account||pulling||!navigator.onLine)return;pulling=true;
  try{const [c,m]=await Promise.all([apiFetch('/api/data'),apiFetch('/api/me').catch(()=>null)]);
    if(m){account={...account,...m};usage=m.usage||usage}
    if(c.data&&c.updated>cloudBase){if(cloudDirty)queueCloud(true);else adoptCloud(c.data,c.updated,true)}}catch(e){}finally{pulling=false}
}
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
window.addEventListener('online',()=>{if(cloudDirty)queueCloud(true)});
window.addEventListener('pagehide',()=>{if(cloudDirty&&account)try{fetch('/api/data',{method:'PUT',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({data:state,updated:state._u,base:cloudBase})})}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloudDirty)queueCloud(true)});
const hasAI=()=>!!account&&navigator.onLine&&account.user.status!=='expired'&&usage.used<usage.limit;
const modelName=()=>'AI';
const aiLeft=()=>Math.max(0,usage.limit-usage.used);
function aiErr(e){return e?.message||String(e)}
async function aiTask(task,input){
  try{const d=await apiFetch('/api/ai',{method:'POST',body:{task,input}});usage={used:d.used,limit:d.limit};return d.result}
  catch(e){if(e.data&&e.data.limit!==undefined)usage={used:e.data.used??usage.used,limit:e.data.limit};if(e.status===402){account.user.status='expired';checkPaywall()}throw e}
}
const statusLabel=()=>{if(!account)return '';const u=account.user;if(u.status==='owner')return 'Owner';if(u.status==='active')return 'Plus';if(u.status==='trial'){const d=Math.max(0,Math.ceil((u.trialEnds-Date.now())/86400000));return `Trial · ${d} day${d===1?'':'s'} left`}return 'Trial ended'};

  set(/^am skincare/i,[tm(wake,15)]);set(/sunlight/i,[tm(wake,30)]);set(/meditation/i,[tm(wake,45)]);set(/deodorant/i,[tm(wake,75)]);

    const pays=sum(T.filter(t=>t.type==='pay'&&inR(t,pEnd,sEnd)),t=>t.amount),spends=sum(T.filter(t=>t.type!=='pay'&&inR(t,pEnd,sEnd)),t=>t.amount);

}

/* ================= Today: missed, up next, done + AI day summary ================= */
function todayBoard(){
  const t=today(),k=ds(t),now=new Date(),mins=now.getHours()*60+now.getMinutes(),tm=s=>{const [h,m]=String(s).split(':').map(Number);return h*60+m};
  const missed=[],next=[],anytime=[],done=[];
  for(const h of state.health.habits.filter(h=>h.period==='daily')){
    if(isDone(h)){done.push({icon:'check',col:'var(--lime)',title:h.name,sub:'Done'});continue}
    const times=(h.times||[]).filter(x=>/^\d{2}:\d{2}$/.test(x)).sort(),later=times.find(x=>tm(x)>mins),past=times.filter(x=>tm(x)<=mins);
    const it={icon:'heart',col:'var(--green)',title:h.name,act:`<button class="btn sm" data-habit="${h.id}">${ic('tick')} Done</button>`};
    if(past.length&&!later)missed.push({...it,time:past[past.length-1],sub:`Was due at ${past[past.length-1]}`});
    else if(later)next.push({...it,time:later,sub:h.detail||'Habit'});
    else anytime.push({...it,sub:h.detail||'Any time today'});
  }
  // Water: how far behind the pace for the day (wake → sleep).
  const L=state.health.logs[k]||{},w=num(L.water),wake=tm(state.profile.wake||'07:00'),bed=tm(state.profile.sleep||'23:00'),frac=Math.max(0,Math.min(1,(mins-wake)/Math.max(60,bed-wake))),should=Math.floor(12*frac);
  if(w<12){if(should-w>=2)missed.push({icon:'drop',col:'var(--cyan)',title:`Water: ${w} of 12 glasses`,sub:`You should be near ${should} by now`,act:`<button class="btn sm" data-water="1">${ic('plus')} 1 glass</button>`});else next.push({icon:'drop',col:'var(--cyan)',title:`Water: ${w} of 12 glasses`,sub:`${12-w} to go`,time:'',act:`<button class="btn sm" data-water="1">${ic('plus')} 1 glass</button>`})}else done.push({icon:'drop',col:'var(--cyan)',title:'12 glasses of water',sub:'Done'});
  if(num(L.steps)>=10000)done.push({icon:'steps',col:'var(--lime)',title:`${num(L.steps).toLocaleString('en-IN')} steps`,sub:'10k done'});
  const F=dayFood(k),T=foodTargets();if(mins>20*60&&F.p<T.p*.7)missed.push({icon:'food',col:'var(--orange)',title:`Protein: ${F.p} of ${T.p} g`,sub:'Add a protein-rich dinner or snack'});
  // Money and dates
  for(const e of lateThisMonth())missed.push({icon:'receipt',col:'var(--red)',title:e.title,sub:`Overdue since ${fmt(e.date,{day:'numeric',month:'short'})} · ${inr(e.amount)}`,act:paidKey(e)?`<button class="btn sm" data-paid="${paidKey(e)}">Mark paid</button>`:''});
  for(const e of eventsBetween(t,t)){const pk=paidKey(e);if(pk&&state.paid[pk]){done.push({icon:'receipt',col:'var(--orange)',title:e.title,sub:'Paid'});continue}
    next.push({icon:e.src==='reminder'?(e.type==='Birthday'?'gift':'calendar'):'receipt',col:e.src==='reminder'?'var(--red)':'var(--orange)',title:e.title,sub:[e.type,e.amount?inr(e.amount):'',e.extra].filter(Boolean).join(' · '),time:'Today',act:pk?`<button class="btn sm" data-paid="${pk}">Mark paid</button>`:''})}
  for(const e of eventsBetween(addDays(t,1),addDays(t,2)).filter(e=>!(paidKey(e)&&state.paid[paidKey(e)])))next.push({icon:e.type==='Birthday'?'gift':'calendar',col:'var(--violet)',title:e.title,sub:`${daysBetween(t,e.date)===1?'Tomorrow':'In 2 days'}${e.amount?' · '+inr(e.amount):''}`,time:fmt(e.date,{weekday:'short'})});
  next.sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99')));
  return {missed,next,anytime,done};
}
function pToday(){
  const B=todayBoard(),t=today(),S=(state.summaries||{})[ds(t)],h=new Date().getHours();
  const row=i=>`<div class="trow">${icoBox(i.icon,i.col)}<div class="nb"><div class="tx">${esc(i.title)}</div>${i.sub?`<div class="tiny muted">${esc(i.sub)}</div>`:''}</div>${i.time?`<span class="pill nodot">${esc(i.time)}</span>`:''}${i.act||''}</div>`;

let gIdx=null,gPrevXP=null,gSoc=null,gSocAt=0,gSyncT=null,gSig='',gTickT=0;
function gIndex(){const tx={},act={},paid={};for(const t of state.tx||[])if(!t.sample&&t.date)tx[t.date]=(tx[t.date]||0)+1;
  for(const a of state.activity||[]){if(a.i==='receipt'||a.i==='card')paid[a.d]=(paid[a.d]||0)+1;else act[a.d]=(act[a.d]||0)+1}return gIdx={tx,act,paid}}

  return {habits:hs.filter(h=>c[h.id]).length,allHabits:hs.length,water:num(L.water),steps:num(L.steps),sleep:num(L.sleep)>0,weight:num(L.weight)>0,meals:((state.meals||{})[k]||[]).length,tx:I.tx[k]||0,paid:I.paid[k]||0,act:I.act[k]||0,journal:!!((state.journal||{})[k]||{}).t}}

  if(!g.q[k]){if(k!==ds(today()))return null;let seed=gHash(k+(account?.user?.id||'me'));const pool=G_QUESTS.filter(q=>!q.ok||q.ok(r)),used=new Set(),pick=[];
    for(let i=0;i<40&&pick.length<3;i++){seed=Math.imul(seed^(seed>>>15),2246822507)>>>0;const q=pool[seed%pool.length];if(!used.has(q.g)){used.add(q.g);pick.push(q.id)}}g.q[k]=pick}
  return g.q[k].map(id=>G_QUESTS.find(x=>x.id===id)).filter(Boolean).map(Q=>{const [c,t]=Q.f(r);return {...Q,cur:Math.min(c,t),target:t,done:t>0&&c>=t}})}

/* ---- the tick: runs on every change; works out today's XP, streak, freezes and what to celebrate ---- */
function gTick(silent){
  const g=G(),t=today(),tk=ds(t);gIndex();const fresh=!g.start;
  if(!g.start){g.start=tk;for(let i=90;i>=1;i--){const k=ds(addDays(t,-i)),x=gDayXP(k);if(x>0)g.days[k]=x}silent=true}
  const before=g.days[tk]||0;
  for(let i=0;i<=7;i++){const k=ds(addDays(t,-i)),x=gDayXP(k);if(x>0)g.days[k]=x;else delete g.days[k]}
  const q=gQuests(tk);g.qc[tk]=q.filter(z=>z.done).length;
  const now=g.days[tk]||0;
  // New day: use streak freezes for missed days, or mark the streak as lost.
  if(g.fchk!==tk){g.fchk=tk;if(!fresh){
    let d=addDays(t,-1);const gap=[];while(gap.length<45&&!gOn(ds(d))){gap.push(ds(d));d=addDays(d,-1)}
    const prev=gap.length&&gap.length<45?gRunFrom(d):0;
    if(prev>0){if(gap.length<=g.freezes){gap.forEach(k=>g.frozen[k]=1);g.freezes-=gap.length;gQueue({type:'freeze',used:gap.length,n:prev})}
      else{g.lost={n:prev,day:gap[0],at:tk,gap:gap.length};gQueue({type:'lost',n:prev,repair:gap.length===1})}}}
    if(g.lost&&g.lost.at!==tk&&ds(addDays(pd(g.lost.at),1))!==tk)delete g.lost;
    for(const k of Object.keys(g.cel))if(/\d{4}-\d{2}-\d{2}$/.test(k)&&k.slice(-10)<ds(addDays(t,-40)))delete g.cel[k];
    for(const k of Object.keys(g.q))if(k<ds(addDays(t,-40))){delete g.q[k]}
  }
  // Streak repair: earn twice the daily goal the day after a single missed day.
  if(g.lost&&g.lost.gap===1&&now>=2*g.goal){g.frozen[g.lost.day]=1;const n=g.lost.n;delete g.lost;gQueue({type:'repair',n:gStreak()})}
  const streak=gStreak();g.best=Math.max(g.best||0,streak);
  if(now>before&&new Date().getHours()<8)g.early[tk]=1;
  const loud=!silent&&now>before;
  if(loud&&gPrevXP!==null&&!gNoFloat)gFloat('+'+(now-before)+' XP');
  const mark=(k,fn)=>{if(g.cel[k])return;g.cel[k]=1;if(!silent)fn()};
  if(now>0)mark('s'+tk,()=>gQueue({type:'streak',n:streak}));
  if(now>=g.goal)mark('g'+tk,()=>gQueue({type:'goal',xp:now}));
  if(q.length&&q.every(z=>z.done))mark('c'+tk,()=>gQueue({type:'chest'}));
  if(G_MILES.includes(streak)&&now>0)mark('m'+streak+':'+tk,()=>gQueue({type:'mile',n:streak}));
  if(streak>0&&streak%7===0&&now>0&&!g.cel['fz'+streak+':'+g.start]){g.cel['fz'+streak+':'+g.start]=1;if(g.freezes<2){g.freezes++;if(!silent)gQueue({type:'freezeEarn',n:streak})}}
  const lv=gLevel(gTotal()).n;if(g.lvl&&lv>g.lvl&&!silent)gQueue({type:'level',n:lv});g.lvl=Math.max(g.lvl||0,lv);

  gPrevXP=now;gSync();
}

    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(rrule)L.push('RRULE:'+rrule);

  for(const l of state.loans){if(num(l.outstanding)<=0||num(l.emi)<=0)continue;const s=loanSim(l),nd=monthlyOcc(2000,0,num(l.dueDay)||1,1,t,addDays(t,40),null)[0];if(!nd)continue;add('emi-'+l.id,nd,`EMI: ${l.name} (₹${num(l.emi).toLocaleString('en-IN')})`,l.lender||'','FREQ=MONTHLY'+(isFinite(s.n)?';COUNT='+s.n:''),2);n++}

function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Date','Payee','Category','Direction','Amount','Method','Note'],...[...state.tx].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>[t.date,t.payee,t.dir==='in'?'Income':t.category,t.dir==='in'?'in':'out',t.amount,t.method,t.note])];
  download(`payments-${ds(today())}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function clearSamples(){
  if(!confirm('Remove all sample income, budget categories, bills, loans, savings and payments? Anything you’ve edited stays.'))return;
  for(const k of ['income','expenses','bills','loans','savings','tx'])state[k]=state[k].filter(x=>!x.sample);
  commit();
}

document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('locked'))return;
  if(e.target.id==='scryIn'){if(e.key==='Escape'){e.preventDefault();closeScry()}else if(e.key==='Enter'){e.preventDefault();pickHit(0)}return}
  const typing=e.target.matches('input,textarea,select');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();scryOpen?closeScry():openScry();return}
  if(typing){if(e.key==='Enter'&&e.target.matches('input[data-log],input[data-month],input[data-ui="extra"],input[data-prof]'))e.target.blur();return}
  if($('#dlg').open||$('#voice').open||$('#asst').open)return;
  if(e.key==='/'){e.preventDefault();openScry()}
  else if(e.key.toLowerCase()==='v'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openAssistant('mic')}
  else if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openForm('tx',null,{date:ds(today()),dir:'out',method:'UPI'})}
  else if(e.key==='Escape'&&menu){menu=null;renderShell()}
});
