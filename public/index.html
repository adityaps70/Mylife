<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Self Streak</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#09090b">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Self Streak">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--side:#0c0d10;--card:#111216;--card2:#17181d;--line:#1f2127;--line2:#2b2d34;
  --text:#f3f4ef;--muted:#8d8f96;--faint:#5f616a;
  --lime:#d7f64a;--lime-ink:#10120a;--lime-text:#d7f64a;--cyan:#45dfe6;--orange:#ff8a4c;--red:#ff4f6e;--yellow:#f5c84c;--violet:#a78bfa;--green:#6fe28a;
  --hl:rgba(255,255,255,.025);--shadow:0 20px 40px -20px rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f3f4ef;--side:#fbfbf8;--card:#ffffff;--card2:#f4f5f0;--line:#e5e6df;--line2:#d6d8d0;
  --text:#121316;--muted:#696b72;--faint:#9b9da3;
  --lime:#cdef2f;--lime-ink:#151708;--lime-text:#557000;--cyan:#0fa8b0;--orange:#e5682a;--red:#e0294d;--yellow:#c48f05;--violet:#7c5ce0;--green:#24984a;
  --hl:rgba(0,0,0,0);--shadow:0 10px 30px -18px rgba(0,0,0,.18);color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{
  --bg:#f3f4ef;--side:#fbfbf8;--card:#ffffff;--card2:#f4f5f0;--line:#e5e6df;--line2:#d6d8d0;
  --text:#121316;--muted:#696b72;--faint:#9b9da3;
  --lime:#cdef2f;--lime-ink:#151708;--lime-text:#557000;--cyan:#0fa8b0;--orange:#e5682a;--red:#e0294d;--yellow:#c48f05;--violet:#7c5ce0;--green:#24984a;
  --hl:rgba(0,0,0,0);--shadow:0 10px 30px -18px rgba(0,0,0,.18);color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.pos{color:var(--lime-text)}.neg{color:var(--red)}.warn{color:var(--yellow)}

/* ---------- shell ---------- */
.side{padding-top:calc(16px + env(safe-area-inset-top))!important;padding-bottom:calc(16px + env(safe-area-inset-bottom))!important;position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:40;transition:width .2s,transform .25s}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 32px}
.logo b{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.logo .sp{flex:1}
.navsec{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:16px 12px 6px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:11px;color:var(--muted);font-weight:500;cursor:pointer;text-align:left;white-space:nowrap;position:relative}
.nav:hover{background:var(--card2);color:var(--text)}
.nav.on{background:var(--card2);color:var(--text)}
.nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--lime);box-shadow:0 0 12px var(--lime)}
.nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--lime);color:var(--lime-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.navscroll{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;cursor:pointer;width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--lime) 18%,var(--card2));color:var(--lime-text);border:1px solid color-mix(in srgb,var(--lime) 40%,transparent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 36px}
.me .t{min-width:0}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:12px;color:var(--muted);white-space:nowrap}
body.collapsed .side{width:76px}
body.collapsed .side .lbl,body.collapsed .navsec,body.collapsed .logo b,body.collapsed .me .t,body.collapsed .nav .badge{display:none}
body.collapsed .nav{justify-content:center}
body.collapsed .logo{flex-direction:column}
.app{margin-left:248px;min-height:100vh;transition:margin .2s}
body.collapsed .app{margin-left:76px}
.topbar{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:10px;padding:0 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.searchbtn{display:flex;align-items:center;gap:10px;width:min(380px,100%);height:42px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--faint);cursor:pointer;text-align:left}
.searchbtn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tsp{flex:1}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text);flex:0 0 42px}
.ibtn:hover{border-color:var(--line2)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.menuwrap{position:relative}
.pop{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);z-index:50;min-width:240px;padding:8px}
.pop.wide{width:min(380px,calc(100vw - 32px))}
@media (max-width:760px){.pop,.pop.wide{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 68px);width:auto;min-width:0;max-height:calc(100dvh - env(safe-area-inset-top) - 170px);overflow-y:auto;transform-origin:top center}}
.pop h4{font-size:13px;padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.mi:hover{background:var(--card2)}
.mi small{color:var(--muted);margin-left:auto}
.hamb{display:none}
main{padding:4px 28px 64px;max-width:1480px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 22px}
.phead .crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.phead h1{font-size:34px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.phead .sp{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.overlay{display:none}

/* ---------- components ---------- */
.card{background:linear-gradient(180deg,var(--hl),transparent 120px),var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch .sp{flex:1}
.ch h3{font-size:16px;font-weight:600}
.ch .sub{font-size:13px;color:var(--muted);margin-top:2px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.lime:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 10px;border-radius:9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.done{background:color-mix(in srgb,var(--lime) 14%,transparent);border-color:color-mix(in srgb,var(--lime) 45%,transparent);color:var(--lime-text)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line2))}
.link{border:0;background:none;color:var(--lime-text);font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
.ic{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.ic:hover{background:var(--card2);color:var(--text)}
.ic svg.i{width:16px;height:16px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--card);border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button em{font-style:normal;font-size:11px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--card2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.pill.orange{color:var(--orange);background:color-mix(in srgb,var(--orange) 13%,transparent)}
.pill.yellow{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 13%,transparent)}
.pill.lime{color:var(--lime-text);background:color-mix(in srgb,var(--lime) 13%,transparent)}
.pill.cyan{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--card2);color:var(--text);border-color:var(--line2)}
.gbar{position:relative;height:7px;border-radius:99px;background:var(--line);overflow:visible}
.gbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime))}
.gbar.over>i{background:linear-gradient(90deg,var(--orange),var(--red))}
.gbar.thick{height:12px}
.gbar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text);opacity:.7}
.segbar{display:flex;gap:4px;height:14px}
.segbar i{border-radius:4px;min-width:4px}
.leg{display:grid;gap:9px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.leg b{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.leg span{flex:1}
.leg em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px;border:1px solid}
.ico svg.i{width:17px;height:17px}
.ri{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ri:last-child{border-bottom:0}
.ri .rb{flex:1;min-width:0}
.ri .rt{font-weight:600;overflow-wrap:anywhere}
.ri .rs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ri .ra{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ri .ra small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.ri.paid .rt{color:var(--muted);text-decoration:line-through}
.ri.clickable{cursor:pointer}
.ri.clickable:hover .rt{color:var(--lime-text)}
.dateblk{width:42px;flex:0 0 42px;text-align:center;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:3px 0;font-size:10.5px;color:var(--muted);text-transform:uppercase;line-height:1.2}
.dateblk b{display:block;font-size:16px;color:var(--text)}
.soon{color:var(--yellow);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.cbills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-top:14px}
.cbill{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card2)}.cbill .mid{font-size:22px;margin:4px 0 2px}
.cbill.late{border-color:color-mix(in srgb,var(--red) 55%,transparent)}.cbill.paid{border-color:color-mix(in srgb,var(--lime) 45%,transparent)}.cbill.next{border-style:dashed}
.ctx{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}.ctx-i{display:flex;align-items:center;gap:8px;min-height:34px}.ctx-i .ic{width:28px;height:28px;opacity:.6}
.dplan-empty{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:radial-gradient(400px 160px at 0% 0%,color-mix(in srgb,var(--lime) 12%,transparent),transparent 70%),var(--card)}
.dplan{background:radial-gradient(500px 200px at 0% 0%,color-mix(in srgb,var(--lime) 10%,transparent),transparent 70%),var(--card)}
.dp-head{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.dp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:22px;margin-top:20px}
.dp-order{list-style:none;display:grid;gap:12px;margin-top:12px;padding:0}.dp-order li{display:flex;gap:12px;align-items:flex-start}
.dp-order .n{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dp-cut{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dp-months{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:0 14px}.dp-months summary{display:flex;gap:10px;align-items:center;cursor:pointer;padding:12px 0;list-style:none}.dp-months summary::-webkit-details-marker{display:none}.dp-months summary .i{margin-left:auto;transition:transform .2s}.dp-months[open] summary .i{transform:rotate(90deg)}
.banner.warnb{border-color:color-mix(in srgb,var(--orange) 45%,transparent);align-items:flex-start}
.prio{position:relative;overflow:hidden;background:radial-gradient(380px 150px at 0 0,color-mix(in srgb,var(--lime) 9%,transparent),transparent 70%),var(--card)}
.pemoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card2);border:1px solid var(--line2);flex:none}.pemoji.sm{width:36px;height:36px;font-size:18px;border-radius:11px}
.pcount{display:flex;align-items:baseline;gap:8px;margin-top:6px}.pcount b{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;font-weight:800}.pcount span{color:var(--muted);font-size:13px}
.pkp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.pkp>div{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 10px;min-width:0}.pkp small{display:block;font-size:11px;color:var(--muted)}.pkp b{font-size:15px;white-space:nowrap}
.pchk{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pchk span{border:1px dashed var(--line2);border-radius:10px;padding:5px 9px;display:grid}.pchk small{font-size:10px;color:var(--faint)}.pchk b{font-size:13px}
.pai{margin-top:14px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--lime) 30%,var(--line));background:color-mix(in srgb,var(--lime) 5%,var(--card2))}
.popts{display:grid;gap:8px;margin-top:10px}.popts>div{padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.popts .pill{margin-top:6px}
.prio-empty .pex{display:flex;flex-wrap:wrap;gap:8px}.pchip{border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:99px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .2s var(--spring)}.pchip:hover{transform:translateY(-2px);border-color:var(--lime)}
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
.pmini{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--lime) 25%,var(--line));background:radial-gradient(260px 100px at 0 0,color-mix(in srgb,var(--lime) 10%,transparent),transparent 70%),var(--card);color:var(--text);cursor:pointer;width:100%}
.pmini .nb{flex:1;min-width:0}.pmini b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.pkp{grid-template-columns:1fr 1fr}.pkp>div:last-child{grid-column:1/-1}}
.jrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.jrow:last-child{border:0}.jrow .nb{flex:1;min-width:0;font-size:14px}.jd{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:12px;padding:4px 0;background:var(--card2)}.jd b{display:block;font-size:17px;line-height:1.1}.jd span{font-size:10px;color:var(--muted);text-transform:uppercase}
.hstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hstrip::-webkit-scrollbar{display:none}
.hday{flex:0 0 52px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;display:grid;justify-items:center;gap:2px;color:var(--text);cursor:pointer;position:relative}
.hday small{font-size:10.5px;color:var(--muted)}.hday b{font-size:17px}.hday i{width:5px;height:5px;border-radius:50%;background:var(--lime)}.hday.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}.hday.on small{color:var(--lime-ink)}.hday.on i{background:var(--lime-ink)}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}.hstat{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.hstat small{display:block;font-size:11px;color:var(--muted)}.hstat b{font-size:16px;display:block}
.hrow2{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--text)}.hrow2:last-child{border-bottom:0}.hrow2 svg.i{color:var(--lime-text)}
.trow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.trow:last-child{border:0}.trow .nb{flex:1;min-width:0}.trow .tx{font-weight:600;font-size:14px}
.tmiss{border-color:color-mix(in srgb,var(--red) 35%,var(--line))}.tnext{border-color:color-mix(in srgb,var(--cyan) 30%,var(--line))}
.tdone summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}.tdone summary::-webkit-details-marker{display:none}.tdone[open] summary .i{transform:rotate(90deg)}
.dsum-empty{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:radial-gradient(380px 150px at 0 0,color-mix(in srgb,var(--lime) 10%,transparent),transparent 70%),var(--card)}.dsum-empty .nb{flex:1;min-width:220px}
.dsum{background:radial-gradient(420px 160px at 0 0,color-mix(in srgb,var(--lime) 9%,transparent),transparent 70%),var(--card)}

.dareas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:8px}.darea{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}.darea .nb{flex:1;min-width:0}

.dtom{margin-top:12px}
#rMsg{color:var(--red);font-size:13px;min-height:18px;margin:0}#rMsg.okmsg{color:var(--lime-text)}
.gwrap{display:grid;gap:10px;justify-items:center}.gwrap[hidden]{display:none}.gor{display:flex;align-items:center;gap:10px;width:100%;color:var(--faint);font-size:12px}.gor::before,.gor::after{content:'';flex:1;height:1px;background:var(--line)}#gbtn{width:100%;display:flex;justify-content:center;min-height:44px}#gbtn iframe{color-scheme:normal}

.admt td{vertical-align:middle;font-size:13px}.admt .sel{height:32px;font-size:12px}
.kpi-jump{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .2s,transform .2s var(--spring)}.kpi-jump:hover{border-color:color-mix(in srgb,var(--lime) 45%,var(--line))}.kpi-jump:active{transform:scale(.98)}
.kpi-jump .l{display:flex;align-items:center;gap:4px}.kj{margin-left:auto;opacity:.45;display:inline-flex}.kj svg.i{width:14px;height:14px}
main [id^="sec-"],main [id^="adm-"]{scroll-margin-top:calc(80px + env(safe-area-inset-top))}
.jumped{animation:jumpGlow 1.4s ease-out}@keyframes jumpGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 60%,transparent)}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--lime) 30%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.setupc .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.setupc .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .6s var(--ease)}
.setupc{background:radial-gradient(420px 160px at 0 0,color-mix(in srgb,var(--lime) 9%,transparent),transparent 70%),var(--card)}
.srow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.srow .nb{flex:1;min-width:180px}.srow b{font-size:14.5px}
.sck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--lime-ink)}.srow.ok .sck{background:var(--lime);border-color:var(--lime)}.sck svg.i{width:13px;height:13px;stroke-width:3}
.srow.ok b{color:var(--muted)}.sbtn{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:14px}

.trend{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--lime) 30%,var(--line));background:color-mix(in srgb,var(--lime) 7%,var(--card));font-size:13.5px}

.banner .sp{flex:1}
.tablewrap{overflow-x:auto}

select{cursor:pointer}

input.cell{width:110px;padding:6px 9px;text-align:right;font-variant-numeric:tabular-nums;background:transparent}
input.cell.ov{border-color:color-mix(in srgb,var(--lime) 60%,transparent);background:color-mix(in srgb,var(--lime) 8%,transparent)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline label{font-size:13px;color:var(--muted);font-weight:600}
.searchin{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:0 11px;height:38px;min-width:220px;flex:1;max-width:340px;color:var(--faint)}
.searchin input{border:0;background:none;padding:0;outline:0;height:100%}
.searchin input:focus{outline:0}

/* layout grids */
.stack{display:grid;gap:20px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.auto{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:0}
.hero .stats{border-left:1px solid var(--line);padding-left:20px;margin-left:20px;display:grid;gap:18px;align-content:start}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:8px;height:8px;border-radius:50%}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--faint);font-size:11px;font-family:inherit}
.gauge-wrap{position:relative;max-width:220px;margin:14px auto 0}
.gauge-wrap .gv{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.gauge-wrap .gv b{display:block;font-size:24px;font-weight:600}
.gauge-wrap .gv span{font-size:12px;color:var(--muted)}
.donutw{position:relative;flex:0 0 auto}
.donutw .dv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.donutw .dv b{font-size:22px;font-weight:600}
.donutw .dv span{font-size:12px;color:var(--muted);display:block}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:0 0 58px}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:13px}
.sq{display:grid;grid-template-columns:repeat(4,22px);gap:5px}
.sq i{width:22px;height:22px;border-radius:6px;background:var(--lime)}
.goalrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit}
.goalrow .gb{flex:1;min-width:0}
.goalrow .gt{display:flex;justify-content:space-between;gap:8px}
.goalrow .gt b{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.goalrow .gt span{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.goalrow .gt span small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.goalrow:hover .gt b{color:var(--lime-text)}
.glabel{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px}
.habit{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.tick{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.tick svg.i{width:13px;height:13px;stroke-width:3}
.tick.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.habit .hb{flex:1;min-width:0}
.habit .hn{font-weight:600;font-size:13.5px}
.habit.done .hn{color:var(--muted);text-decoration:line-through}
.habit .hd{font-size:12px;color:var(--muted)}
.streak{font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap}
.ms{display:flex;gap:9px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.ms .tick{flex-basis:18px;width:18px;height:18px;border-radius:5px}
.ms.done span{color:var(--muted);text-decoration:line-through}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.cat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cat .cb{flex:1;min-width:0}
.cat .ct{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cat .ct b{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ct .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .ct .amt small{color:var(--muted);font-weight:500}
.cat .cs{font-size:12px;color:var(--muted);margin-top:7px}
.cat:hover b{color:var(--lime-text)}
.dayhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.months{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.mon h4{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .dow{font-size:10px;color:var(--faint);text-align:center;padding:2px 0}
.day{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--text)}
.day:hover{background:var(--card2)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--lime);font-weight:700}
.day.sel{background:color-mix(in srgb,var(--lime) 16%,transparent)}
.day .dots{display:flex;gap:2px;height:5px}

.logs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.logt{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.logt .lb{flex:1;min-width:0}
.logt label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.logt input{font-size:18px;font-weight:600;padding:6px 10px;background:var(--card)}
.water{display:flex;align-items:center;gap:8px}
.water b{font-size:18px;min-width:60px;text-align:center}
.paidcell{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;padding:0;color:transparent;display:grid;place-items:center;margin-left:auto}
.paidcell svg.i{width:12px;height:12px;stroke-width:3}
.paidcell.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.paidcell.late{border-color:var(--red)}
.season{display:flex;gap:12px}
.season ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.season ul li{margin:3px 0}
.tips{margin:0;padding-left:18px;font-size:13.5px}
.tips li{margin:6px 0}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:36px}

/* ================= motion ================= */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body::before{content:"";position:fixed;inset:-25vmax;pointer-events:none;z-index:0;background:radial-gradient(38vmax 28vmax at 18% 8%,color-mix(in srgb,var(--lime) 7%,transparent),transparent 70%),radial-gradient(34vmax 28vmax at 88% 35%,color-mix(in srgb,var(--cyan) 6%,transparent),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4vmax,3vmax,0) rotate(6deg)}}
.app{position:relative;z-index:1}
.anim .card,.anim .kpi,.anim .banner,.anim .phead,.anim .logt,.anim>.stack>.inline,.anim>.stack>.chips{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
.anim .phead h1 .w{display:inline-block;animation:wordUp .8s var(--spring) backwards;animation-delay:calc(var(--w)*80ms + 60ms)}
@keyframes wordUp{from{opacity:0;transform:translateY(55%) rotate(5deg)}}
.anim .gbar>i,.anim .segbar i{animation:grow 1.1s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms + .18s);transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}}
.anim svg.chart rect,.anim svg.bars rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .9s var(--ease) backwards;animation-delay:calc(var(--b,0)*28ms + .2s)}
@keyframes barUp{from{transform:scaleY(0)}}
.anim svg.chart path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim svg.chart circle{animation:fadeIn .4s 1.1s backwards}
.anim .donutw svg circle:nth-child(2),.anim .gauge-wrap svg path:nth-child(2){animation:dashIn 1.4s var(--ease) .2s backwards}
@keyframes dashIn{from{stroke-dasharray:0 100}}
.anim .ring{animation:ringIn 1.2s var(--ease) .15s backwards}
@keyframes ringIn{from{--p:0}}
@keyframes fadeIn{from{opacity:0}}
.anim-side .nav.on::before{animation:navIn .5s var(--spring)}
@keyframes navIn{from{transform:scaleY(0)}}
.anim-side .badge{animation:bump .5s var(--spring) .3s backwards}
.nav svg.i{transition:transform .3s var(--spring)}
.nav:hover svg.i{transform:scale(1.12) rotate(-6deg)}
.btn,.ibtn,.chip,.tick,.paidcell,.seg button,.ic,.mi,.day,.glass,.hc,.mood{transition:transform .18s var(--ease),background-color .2s,border-color .2s,color .2s,box-shadow .25s,opacity .2s}
.btn:active,.ibtn:active,.chip:active,.tick:active,.ic:active,.paidcell:active,.seg button:active,.day:active,.glass:active{transform:scale(.93)}
.btn.lime:hover{transform:translateY(-1px);box-shadow:0 8px 26px -8px color-mix(in srgb,var(--lime) 70%,transparent)}
.btn.open svg.i{animation:rot45 .35s var(--spring) forwards}
@keyframes rot45{to{transform:rotate(135deg)}}
.card{position:relative;transition:border-color .3s}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--lime) 8%,transparent),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover::after{opacity:1}
.card:hover{border-color:var(--line2)}
.kpi{transition:transform .3s var(--ease),border-color .3s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.ibtn .dot{animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 2px var(--card),0 0 0 2px color-mix(in srgb,var(--red) 70%,transparent)}70%,100%{box-shadow:0 0 0 2px var(--card),0 0 0 9px transparent}}
.pop{animation:popIn .26s var(--spring);transform-origin:top right}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.95)}}
.tick.bump,.btn.bump,.paidcell.bump{animation:bump .5s var(--spring)}
.tick.bump svg path,.paidcell.bump svg path,.btn.bump svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .35s .12s forwards}
@keyframes bump{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.habit.bump .hn{animation:flash .7s}
@keyframes flash{30%{color:var(--lime-text)}}
dialog[open]{animation:dlgIn .4s var(--spring)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
dialog.closing{animation:dlgOut .18s ease forwards}
dialog.closing::backdrop{animation:fadeOut .18s ease forwards}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fadeOut{to{opacity:0}}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:90;pointer-events:none;justify-items:center}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;font-size:13.5px;box-shadow:0 14px 40px -10px rgba(0,0,0,.55);animation:toastIn .45s var(--spring);white-space:nowrap}
.toast .tic{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.toast .tic svg.i{width:14px;height:14px;stroke-width:2.6}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.particle{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:95}
/* scry search */
.scry{position:relative;width:42px;height:42px;flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:21px;transition:width .55s var(--ease),border-radius .55s var(--ease),border-color .3s}
.scry.open{width:min(440px,calc(100vw - 600px));border-radius:13px;border-color:var(--line2)}
.scry input{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;padding:0 46px 0 16px;opacity:0;pointer-events:none;transition:opacity .2s;border-radius:inherit}
.scry.open input{opacity:1;pointer-events:auto;transition:opacity .3s .22s}
.scry input:focus{outline:0}
.scry-btn{position:absolute;top:0;left:0;width:40px;height:40px;border:0;background:none;color:var(--text);cursor:pointer;display:grid;place-items:center;border-radius:20px;transition:left .55s var(--ease)}
.scry.open .scry-btn{left:calc(100% - 40px)}
.scry-btn svg.i{grid-area:1/1;transition:transform .45s var(--spring),opacity .25s}
.scry-btn .sx{opacity:0;transform:rotate(-90deg) scale(.4)}
.scry.open .scry-btn .ss{opacity:0;transform:rotate(90deg) scale(.4)}
.scry.open .scry-btn .sx{opacity:1;transform:none}
.scry-res{left:0;right:auto;top:50px;width:100%;min-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;transform-origin:top left}
.scry-res .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
/* lumen theme reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.lumen svg.i{transition:transform .5s var(--spring)}
.lumen:hover svg.i{transform:rotate(30deg) scale(1.1)}
/* top pill (streak + year) */
.tpill{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tpill b{color:var(--text)}
.tpill .yr{width:18px;height:18px;border-radius:50%;flex:0 0 18px;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line2) 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
@media (max-width:1240px){.tpill{display:none}}
/* gulp delete */
.gulp{position:relative;transition:width .35s var(--ease),border-radius .35s,background-color .2s}
.gulp .bin{position:relative;width:16px;height:18px;display:inline-block;flex:0 0 16px}
.gulp .bin svg{position:absolute;inset:0;width:16px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.gulp .lid{transform-origin:1px 4.5px;transition:transform .28s var(--spring)}
.gulp.eating .lid{transform:rotate(-34deg) translateY(-1px)}
.gulp .gw{display:inline-flex}
.gulp .gw i{font-style:normal;display:inline-block}
.gulp.armed{background:color-mix(in srgb,var(--red) 14%,transparent);animation:armPulse 1s ease infinite}
@keyframes armPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 18%,transparent)}}
.gulp.loading{width:38px!important;padding:0;justify-content:center;border-radius:50%}
.gulp .spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--red) 30%,transparent);border-top-color:var(--red);animation:spin .6s linear infinite}
.gulp.loading .spin{display:block}.gulp.loading .bin,.gulp.loading .gw{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.delhint{font-size:12px;color:var(--red);align-self:center;animation:fadeIn .2s}
/* gyre unlock */
.gyre{position:relative;height:120px;display:none}
.lockcard.ok .gyre{display:block}
.lockcard.ok #lockpw,.lockcard.ok .cbx,.lockcard.ok #lockbtn,.lockcard.ok #lockerr,.lockcard.ok .lsub{display:none}
.gyre i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:10px;background:var(--lime);box-shadow:0 0 18px color-mix(in srgb,var(--lime) 50%,transparent);opacity:0}
.gyre .gok{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:19px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;opacity:0;box-shadow:0 0 40px color-mix(in srgb,var(--lime) 45%,transparent)}
.gyre .gok svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gyre .gok path{stroke-dasharray:30;stroke-dashoffset:30}
.lockcard{animation:rise .7s var(--spring)}
/* halvi-style dial, water glasses, hatched bars */
.dial{position:relative;width:210px;max-width:100%;margin:0 auto}
.dial svg{width:100%;display:block}
.dial line{stroke-width:5.5;stroke-linecap:round}
.anim .dial line.on{animation:tickIn .5s var(--ease) backwards;animation-delay:calc(var(--t)*18ms + .25s)}
@keyframes tickIn{from{stroke:var(--line)}}
.dial .dv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial .dn{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1}
.glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
.glass{height:46px;border-radius:11px;border:1px solid var(--line2);cursor:pointer;padding:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 7px);position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--cyan) 85%,#fff),var(--cyan));transform:scaleY(0);transform-origin:bottom}
.glass.on{border-color:transparent}
.glass.on::after{transform:scaleY(1)}
.glass.fill::after{animation:fillUp .55s var(--spring) backwards;animation-delay:calc(var(--g)*70ms)}
@keyframes fillUp{from{transform:scaleY(0)}}
.glass:hover{border-color:var(--cyan)}
svg.bars{width:100%;height:auto;display:block}
svg.bars text{fill:var(--faint);font-size:11px;font-family:inherit}
/* cairnly-style streak, heatmap, cairn, journal */
.streakdots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.sd{width:15px;height:15px;border-radius:50%;background:var(--line)}
.sd.full{background:var(--lime)}.sd.half{background:color-mix(in srgb,var(--lime) 40%,var(--line))}
.sd.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--lime)}
.anim .sd{animation:bump .45s var(--spring) backwards;animation-delay:calc(var(--s)*30ms + .2s)}
.heat{display:grid;grid-template-columns:18px repeat(16,minmax(0,1fr));gap:5px;align-items:center}
.hc{aspect-ratio:1;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;width:100%;max-width:26px;justify-self:center}
.hc.l1{background:color-mix(in srgb,var(--lime) 30%,var(--line))}.hc.l2{background:color-mix(in srgb,var(--lime) 62%,var(--line))}.hc.l3{background:var(--lime)}
.hc.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.hc.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--text)}
.hc.sel{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--cyan)}
.hc:not(.fut):hover{transform:scale(1.2)}
.anim .hc{animation:bump .45s var(--spring) backwards;animation-delay:calc(var(--c)*32ms + .15s)}
.heat .dl,.hm-months span{font-size:10.5px;color:var(--faint)}
.hm-months{display:grid;grid-template-columns:18px repeat(16,minmax(0,1fr));gap:5px;margin-top:6px;white-space:nowrap}
.hm-legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hm-legend span{display:inline-flex;gap:5px;align-items:center}
.hm-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cairn{display:block;margin:4px auto 0;overflow:visible}
.cairn .st.new{animation:drop .75s var(--spring) backwards;animation-delay:calc(var(--s)*110ms + .15s)}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}}
.moods{display:flex;gap:9px;align-items:center}
.mood{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;padding:0;background:color-mix(in srgb,var(--lime) calc(var(--m)*19%),var(--line2))}
.mood.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--lime);transform:scale(1.12)}
textarea.jl{min-height:80px;resize:vertical}
/* motion off */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
html.nomotion *,html.nomotion *::before,html.nomotion *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
/* ================= AI, voice, import, notifications ================= */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;width:60px;height:60px;border-radius:50%;border:0;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 34px -10px color-mix(in srgb,var(--lime) 75%,transparent);transition:transform .25s var(--spring)}
.fab svg.i{width:24px;height:24px;stroke-width:2}
.fab:hover{transform:scale(1.07)}.fab:active{transform:scale(.93)}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--lime);opacity:0;animation:fabRing 3.2s ease-out infinite;pointer-events:none}
@keyframes fabRing{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.65);opacity:0}}
body.locked .fab{display:none}
#voice{width:min(540px,calc(100vw - 24px))}
#voice .seg{flex-wrap:nowrap}
dialog{overflow:auto;overscroll-behavior:contain}
.vbody{padding:22px;display:grid;gap:16px}
.orb{position:relative;width:118px;height:118px;margin:2px auto 0;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--lime) 80%,#fff),var(--lime) 58%,color-mix(in srgb,var(--lime) 72%,#000));color:var(--lime-ink);display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--spring)}
.orb:active{transform:scale(.94)}
.orb svg.i{width:38px;height:38px;stroke-width:2}
.orb.on{animation:orbPulse 1.5s ease-in-out infinite}
@keyframes orbPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 45%,transparent),0 0 0 0 color-mix(in srgb,var(--lime) 20%,transparent)}50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--lime) 18%,transparent),0 0 0 36px color-mix(in srgb,var(--lime) 7%,transparent)}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:30px}
.wave i{width:4px;height:6px;border-radius:3px;background:var(--lime);opacity:.3;transition:opacity .3s}
.wave.on i{opacity:1;animation:wv .85s ease-in-out infinite;animation-delay:calc(var(--k)*80ms)}
@keyframes wv{50%{height:28px}}
.vtext{min-height:54px;font-size:18px;font-weight:600;text-align:center;line-height:1.45;display:grid;place-items:center}
.vtext .interim{color:var(--muted);font-weight:500}
.vres .ri{animation:rise .5s var(--spring) backwards;animation-delay:calc(var(--k)*80ms)}
.vstatus{font-size:13px;color:var(--muted);text-align:center}
.thinking{display:flex;gap:7px;justify-content:center}
.thinking i{width:9px;height:9px;border-radius:50%;background:var(--lime);animation:dots 1s infinite;animation-delay:calc(var(--k)*150ms)}
@keyframes dots{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
dialog.wide{width:min(1000px,calc(100vw - 24px))}
.drop{border:2px dashed var(--line2);border-radius:18px;padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background-color .2s;display:grid;gap:8px;justify-items:center}
.drop:hover,.drop.over{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 6%,transparent)}
.drop .ico{width:54px;height:54px;flex-basis:54px;border-radius:16px}
.scan{position:relative;height:150px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:repeating-linear-gradient(180deg,var(--card2) 0 12px,transparent 12px 24px)}
.scan::after{content:"";position:absolute;left:0;right:0;height:50px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--lime) 32%,transparent),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:-50px}100%{top:150px}}
.imptable{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
.imptable table{font-size:13px}
.imptable th{position:sticky;top:0;background:var(--card);z-index:1}
.imptable tr.off td{opacity:.45}
.imptable select{height:30px;padding:0 6px;font-size:12px;width:auto;max-width:190px}
.imptable input[type=checkbox],.cbx input{accent-color:var(--lime);width:16px;height:16px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.dup{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 13%,transparent)}
.tag.bill{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.lane{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane .rb{flex:1;min-width:0}
.tl .tm{font-weight:700;font-variant-numeric:tabular-nums;width:46px;flex:0 0 46px;color:var(--muted);font-size:13px}
.switch{position:relative;width:44px;height:26px;flex:0 0 44px;border-radius:99px;border:0;background:var(--line2);cursor:pointer;padding:0;transition:background-color .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--spring),background-color .25s}
.switch.on{background:var(--lime)}.switch.on::after{transform:translateX(18px);background:var(--lime-ink)}
.nzrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nzrow:last-child{border-bottom:0}
.nzrow .nb{flex:1;min-width:200px}
.nzrow input,.nzrow select{width:auto}
.nzrow input.times{width:min(270px,100%)}
input[type=time]{width:112px}
.htable td{padding:7px 8px}
.htable input,.htable select{height:32px;padding:0 8px;font-size:13px;width:auto}
@media (max-width:860px){.fab{right:16px;width:56px;height:56px;bottom:calc(16px + env(safe-area-inset-bottom))}#toasts{bottom:calc(86px + env(safe-area-inset-bottom))}.nzrow .nb{min-width:100%}}
@supports (padding:env(safe-area-inset-top)){.topbar{padding-top:env(safe-area-inset-top);height:calc(68px + env(safe-area-inset-top))}}

/* ================= Notes sheet (Apple Notes style) ================= */
#voice.notes{--nbg:#fbfaf7;--nink:#1d1d1f;--nmut:#8a8a8e;--nacc:#d9a400;--nline:#e9e7e1;--ncard:#ffffff;padding:0;background:var(--nbg);color:var(--nink);border:1px solid var(--nline);width:min(760px,calc(100vw - 24px));height:min(820px,calc(100dvh - 40px));max-height:calc(100dvh - 24px);overflow:hidden;font-family:-apple-system,"SF Pro Text","Helvetica Neue","Plus Jakarta Sans",system-ui,sans-serif}
:root[data-theme="dark"] #voice.notes{--nbg:#1c1c1e;--nink:#f2f2f7;--nmut:#8e8e93;--nacc:#ffd60a;--nline:#2c2c2e;--ncard:#2c2c2e}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] #voice.notes{--nbg:#1c1c1e;--nink:#f2f2f7;--nmut:#8e8e93;--nacc:#ffd60a;--nline:#2c2c2e;--ncard:#2c2c2e}}
#voice.notes[open]{display:flex;flex-direction:column}
.nt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 4px;padding-top:calc(14px + env(safe-area-inset-top))}
.nt-actions{display:flex;align-items:center;gap:4px}
.nt-link{border:0;background:none;color:var(--nacc);font:500 17px/1.2 inherit;font-family:inherit;display:inline-flex;align-items:center;gap:2px;cursor:pointer;padding:8px 6px;border-radius:10px;min-height:40px}
.nt-link svg.i{width:20px;height:20px;stroke-width:2.2}
.nt-link:hover{background:color-mix(in srgb,var(--nacc) 10%,transparent)}
.nt-ic{min-width:40px;justify-content:center;font-size:15px;font-weight:600}
.nt-ic.off{color:var(--nmut)}
.nt-done{font-weight:600;padding-left:10px}
.nt-date{font-size:12.5px;color:var(--nmut);text-align:center;padding:2px 0 6px}
.nt-body{flex:1;overflow-y:auto;padding:4px 26px 24px;overscroll-behavior:contain}
.nt-text{font-size:17px;line-height:1.55;color:var(--nink);white-space:pre-wrap;word-wrap:break-word;min-height:38%;outline:0;caret-color:var(--nacc)}
.nt-text .nt-title{font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
.nt-text:empty::before{content:attr(data-ph);color:var(--nmut);white-space:pre-wrap;pointer-events:none}
.nt-text .interim{color:var(--nmut)}
.nt-text .caret{display:inline-block;width:2px;height:1.15em;margin-left:1px;background:var(--nacc);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nt-sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nmut);margin:26px 0 8px}
.nt-assigned{display:grid;gap:8px}
.nt-chip{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--ncard);border:1px solid var(--nline);animation:chipIn .5s var(--spring) backwards;animation-delay:calc(var(--k)*60ms)}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.nt-chip .nb{flex:1;min-width:0}
.nt-chip .to{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--nacc)}
.nt-chip .tx{font-size:14.5px;font-weight:600}
.nt-chip .sb{font-size:12px;color:var(--nmut)}
.nt-chip svg.ok{color:var(--nacc);width:18px;height:18px;stroke-width:2.6}
.nt-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--nline);background:var(--nbg)}
.nt-status{font-size:13px;color:var(--nmut);display:flex;align-items:center;gap:8px;min-width:0}
.nt-status.r{justify-content:flex-end}
.nt-mic{width:62px;height:62px;border-radius:50%;border:0;background:var(--nacc);color:#1d1d1f;display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--spring),background-color .25s;box-shadow:0 10px 26px -10px color-mix(in srgb,var(--nacc) 80%,transparent)}
.nt-mic svg.i{width:26px;height:26px;stroke-width:2.2}
.nt-mic.sm{width:48px;height:48px}
.nt-mic:active{transform:scale(.92)}
.nt-mic.on{background:#ff3b30;color:#fff;animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}50%{box-shadow:0 0 0 14px rgba(255,59,48,0)}}
.nt-wave{display:inline-flex;gap:3px;align-items:center;height:16px}
.nt-wave i{width:3px;height:5px;border-radius:2px;background:#ff3b30;animation:wv .8s ease-in-out infinite}
.nt-wave i:nth-child(2){animation-delay:.1s}.nt-wave i:nth-child(3){animation-delay:.2s}.nt-wave i:nth-child(4){animation-delay:.3s}.nt-wave i:nth-child(5){animation-delay:.4s}
.nt-h1{font-size:32px;font-weight:700;letter-spacing:-.02em;padding:0 22px}
.nt-sub{font-size:13px;color:var(--nmut);padding:2px 22px 10px}
.nt-list{padding:0 10px 20px}
.nt-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--nline)}
.nt-row:hover{background:var(--ncard)}
.nt-row .nb{flex:1;min-width:0}
.nt-row b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-row .sb{font-size:13px;color:var(--nmut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-row .sb span{color:var(--nink);margin-right:6px}
.nt-count{font-size:11.5px;font-weight:700;color:var(--nacc);white-space:nowrap}
.nt-del{border:0;background:none;color:var(--nmut);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;opacity:.6}
.nt-del:hover{opacity:1;background:var(--ncard)}
.nt-del svg.i{width:15px;height:15px}
@media (max-width:860px){
  #voice.notes{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;border:0;border-radius:0}
  #voice.notes[open]{animation:sheetUp .45s var(--spring)}
  .nt-body{padding:4px 20px 20px}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));column-gap:36px}
.shelf .ri:last-child{border-bottom:1px solid var(--line)}
/* ================= SaaS: auth, onboarding, paywall, food ================= */

.onb-bg i:nth-child(1){background:var(--lime);left:-12vmax;top:-14vmax}
.onb-bg i:nth-child(2){background:var(--cyan);right:-16vmax;top:20vh;animation-duration:18s}

.onb{position:relative;width:min(520px,100%);display:grid;gap:22px}
.onb-top{display:flex;align-items:center;gap:12px}
.onb-dots{flex:1;display:flex;gap:6px}
.onb-dots i{flex:1;height:4px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
.onb-dots i.on::after{content:"";position:absolute;inset:0;background:var(--lime);animation:grow .5s var(--ease) both;transform-origin:left}
.onb-step{display:grid;gap:16px}
.onb-step>*{animation:onbIn .6s var(--spring) backwards;animation-delay:calc(var(--d,0)*70ms)}
.onb-step.back>*{animation-name:onbBack}
@keyframes onbIn{from{opacity:0;transform:translateX(34px)}}
@keyframes onbBack{from{opacity:0;transform:translateX(-34px)}}
.onb h1{font-size:clamp(28px,6vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.onb p.lead{color:var(--muted);font-size:15.5px;line-height:1.6}
.onb .hero-ico{width:84px;height:84px;border-radius:26px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-size:40px;font-weight:800;box-shadow:0 20px 50px -18px color-mix(in srgb,var(--lime) 80%,transparent);animation:heroPop 1s var(--spring) both}
@keyframes heroPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.1) rotate(6deg)}100%{transform:none;opacity:1}}
.onb .feat{display:grid;gap:10px}
.onb .feat div{display:flex;gap:12px;align-items:center;font-size:14.5px}
.onb .fields{grid-template-columns:1fr 1fr}
.onb .tchips{display:flex;flex-wrap:wrap;gap:10px}
.onb .tchip{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;font-weight:600;font-size:14px;transition:transform .2s var(--spring),border-color .2s,background-color .2s}
.onb .tchip.on{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 12%,var(--card));transform:scale(1.03)}
.onb .tchip svg.i{width:18px;height:18px}
.onb-nav{display:flex;gap:10px;align-items:center}
.onb-nav .btn{height:48px;padding:0 22px;font-size:15px;border-radius:14px}
.onb-nav .sp{flex:1}
.onb .hint{font-size:12.5px;color:var(--faint)}
.paycard{width:min(460px,100%);text-align:center;display:grid;gap:16px;padding:30px 26px}
.paycard .price{font-size:44px;font-weight:700;letter-spacing:-.03em}
.paycard .price small{font-size:15px;color:var(--muted);font-weight:500}
.paycard ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left}
.paycard li{display:flex;gap:10px;align-items:center;font-size:14px}
.paycard li svg.i{color:var(--lime-text)}
.macro{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.macro b{font-variant-numeric:tabular-nums}
.meal{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .nb{flex:1;min-width:0}
.meal .tx{font-weight:600}
.meal .sb{font-size:12px;color:var(--muted)}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.review-grid,.onb .fields{grid-template-columns:1fr}}

/* ================= logo ================= */
.logo-mk{display:block;flex:0 0 auto;border-radius:24%}
.logo-mk.draw .lp{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .2s forwards}
.logo-mk.draw .ld{animation:bump .6s var(--spring) 1.1s backwards}
/* ================= assistant bar (Google-style pill) ================= */
.askbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:4px;width:min(440px,calc(100vw - 32px));height:58px;padding:0 6px 0 8px;border-radius:30px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 18px 40px -16px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--lime) 18%,transparent);animation:rise .6s var(--spring) .2s backwards}
.askbar .ask-text{flex:1;display:flex;align-items:center;gap:10px;height:100%;border:0;background:none;color:var(--muted);font-size:15px;text-align:left;cursor:text;padding:0 6px;min-width:0}
.askbar .ask-text span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.askbar .ab{width:44px;height:44px;border-radius:50%;border:0;background:var(--card2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:0 0 44px;transition:transform .2s var(--spring),background-color .2s}
.askbar .ab:active{transform:scale(.9)}
.askbar .ab.mic{background:var(--lime);color:var(--lime-ink)}
.askbar .ab svg.i{width:21px;height:21px;stroke-width:2}
body.locked .askbar{display:none}
@media (min-width:861px){.askbar{left:auto;right:24px;transform:none;width:380px}}
#toasts{bottom:calc(92px + env(safe-area-inset-bottom))!important}
main{padding-bottom:110px!important}
/* ================= assistant sheet ================= */
#asst{padding:0;width:min(680px,calc(100vw - 24px));height:min(820px,calc(100dvh - 40px));max-height:calc(100dvh - 24px);overflow:hidden;background:var(--bg);border:1px solid var(--line2)}
#asst[open]{display:flex;flex-direction:column}
.as-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.as-brand{display:flex;align-items:center;gap:10px;min-width:0}
.as-brand b{font-size:15px}
.as-log{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.as-hello{margin:auto;text-align:center;display:grid;gap:10px;justify-items:center;max-width:420px;padding:10px}
.as-hello h3{font-size:22px;letter-spacing:-.02em}
.as-sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.as-row{display:flex;gap:10px;align-items:flex-end;animation:rise .4s var(--spring) backwards}
.as-row.me{justify-content:flex-end;border:0;background:none;padding:0;margin:0;cursor:auto;align-items:flex-end}
.as-b.me{display:grid;margin:0;width:auto;cursor:auto;text-align:left;padding:11px 14px;border-radius:18px}
.as-av{flex:0 0 26px}
.as-b{max-width:min(82%,520px);padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;display:grid;gap:8px}
.as-b.me{background:color-mix(in srgb,var(--lime) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--lime) 30%,transparent);border-bottom-right-radius:6px}
.as-b.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.as-b img{max-width:220px;width:100%;border-radius:12px;display:block}
.as-file{display:flex;gap:6px;align-items:center;font-weight:600}
.as-chips{display:grid;gap:6px}
.as-chip{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);animation:chipIn .5s var(--spring) backwards;animation-delay:calc(var(--k)*60ms)}
.as-chip .ico{width:32px;height:32px;flex-basis:32px;border-radius:9px}
.as-chip .nb{flex:1;min-width:0}
.as-chip .to{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--lime-text)}
.as-chip .tx{font-weight:600;font-size:13.5px}
.as-chip .sb{font-size:12px;color:var(--muted)}
.as-chip svg.ok{color:var(--lime-text);width:16px;height:16px;stroke-width:2.6}
.as-btns{display:flex;flex-wrap:wrap;gap:6px}
.as-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.as-bar .as-btn.go.on{box-shadow:0 0 0 calc(var(--lvl,0) * 16px) color-mix(in srgb,var(--lime) 30%,transparent);transition:box-shadow .08s linear}
.as-field{flex:1;min-width:0;position:relative;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:4px 12px}
.as-field textarea{display:block;width:100%;min-height:0;height:38px;border:0;background:none;padding:8px 0;resize:none;font-size:15.5px;line-height:22px;max-height:140px;outline:0;overflow-y:hidden;box-shadow:none}
.as-field textarea:focus{outline:0}
.as-interim{font-size:14px;color:var(--muted);padding:0 0 6px}
.as-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--card2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:0 0 46px;transition:transform .2s var(--spring),background-color .2s}
.as-btn:active{transform:scale(.9)}
.as-btn svg.i{width:21px;height:21px;stroke-width:2}
.as-btn.go{background:var(--lime);color:var(--lime-ink)}
.as-btn.go.on{background:#ff3b30;color:#fff;animation:micPulse 1.4s ease-in-out infinite}
.as-bar.rec .as-field{border-color:#ff3b30}
@media (max-width:860px){#asst{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;border:0;border-radius:0}#asst[open]{animation:sheetUp .45s var(--spring)}}
/* ================= notes page ================= */
.note-card{text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;min-height:130px;color:var(--text);font:inherit}
.note-card b{font-size:16px}
.note-card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* ================= water glasses ================= */
.glasses2{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.glass2{border:0;background:none;padding:0;cursor:pointer;aspect-ratio:40/54;position:relative;transition:transform .25s var(--spring)}
.glass2:hover{transform:translateY(-2px)}
.glass2:active{transform:scale(.9)}
.glass2 svg{width:100%;height:100%;display:block;overflow:visible}
.glass2 .rim{fill:color-mix(in srgb,var(--cyan) 6%,transparent);stroke:var(--line2);stroke-width:2;stroke-linejoin:round}
.glass2.on .rim{stroke:color-mix(in srgb,var(--cyan) 70%,var(--line2))}
.glass2 .shine{stroke:rgba(255,255,255,.35);stroke-width:2;stroke-linecap:round;fill:none}
.glass2 .wv{transform:translateY(46px);transition:transform .9s var(--spring)}
.glass2.on .wv{transform:translateY(0)}
.glass2 .wa{fill:var(--cyan);opacity:.95;animation:wave 2.2s linear infinite}
.glass2 .wb{fill:color-mix(in srgb,var(--cyan) 70%,#fff);opacity:.45;animation:wave 3.1s linear infinite reverse}
@keyframes wave{to{transform:translateX(20px)}}
.glass2 .bub{fill:rgba(255,255,255,.7);opacity:0}
.glass2.on .bub{animation:bub 2.6s ease-in infinite}
.glass2.on .bub.b2{animation-delay:1.2s}
@keyframes bub{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-28px)}}
.glass2.fill .wv{animation:fillGlass 1.1s var(--spring) backwards;animation-delay:calc(var(--g)*90ms)}
@keyframes fillGlass{from{transform:translateY(46px)}}
.wdrop{position:fixed;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--cyan);pointer-events:none;z-index:95}
.water-big{display:flex;align-items:baseline;gap:8px}
/* ================= notifications page ================= */
.nhero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.nhero .nb{flex:1;min-width:240px}
.nbell{position:relative;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--card2);color:var(--muted);flex:0 0 64px}
.nhero.on .nbell{background:var(--lime);color:var(--lime-ink)}
.nbell svg.i{width:28px;height:28px}
.nhero.on .nbell svg{animation:ring 2.8s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}85%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
.nhero.on .pulse{position:absolute;inset:0;border-radius:20px;box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 50%,transparent);animation:ping 2.4s ease-out infinite}
.nact{display:flex;flex-direction:column;gap:8px}
.ntl{display:grid;gap:16px}
.ntl-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ntl-i{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ntl-i:last-child{border-bottom:0}
.ntl-i.sent .tx,.ntl-i.skip .tx,.ntl-i.willskip .tx,.ntl-i.passed .tx{color:var(--muted)}
.ntl-t{font-weight:700;font-variant-numeric:tabular-nums;width:46px;flex:0 0 46px;font-size:13px;color:var(--muted)}
.ntl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.ntl-i .nb{flex:1;min-width:0}
.ntl-i .tx{font-weight:600;font-size:14px}
.rules{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.rule{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;transition:opacity .25s}
.rule.off{opacity:.55}
.rule.master{background:none;border:0;padding:0;opacity:1}
.rule.master .ico,.rule.master .nb{display:none}
.rule-h{display:flex;gap:12px;align-items:center}
.rule-h .nb{flex:1;min-width:0}
.tchip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpill2{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);color:var(--text)}
.tpill2 input[type=time]{border:0;background:none;padding:0;width:auto;font-weight:600;font-size:13.5px;height:100%;color:var(--text)}
.tpill2 input:focus{outline:0}
.tpill2 .x{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.tpill2 .x svg.i{width:12px;height:12px}
.tpill2.add{padding:0 10px;cursor:pointer;border-style:dashed}
.tpill2.add svg.i{width:14px;height:14px}
.hcard summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.hcard summary::-webkit-details-marker{display:none}
.hcard[open] summary>svg{transform:rotate(90deg)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .nb{flex:1;min-width:170px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hsteps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.hsteps>div{display:grid;gap:6px;align-content:start}

/* lock screen */
#lock{display:none}
body.locked .side,body.locked .app,body.locked .overlay{display:none!important}
body.locked #lock{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(600px 400px at 50% 20%,color-mix(in srgb,var(--lime) 9%,transparent),transparent),var(--bg)}
.lockcard{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px;display:grid;gap:14px;text-align:center;box-shadow:var(--shadow)}
.lockcard .mk{width:52px;height:52px;border-radius:16px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin:0 auto 4px}
.lockcard .mk svg.i{width:24px;height:24px}
.lockcard h2{font-size:24px;font-weight:600;letter-spacing:-.02em}
.lockcard input[type=password]{height:48px;font-size:16px;text-align:center;letter-spacing:.08em}
.lockcard .cbx{justify-content:center;font-size:13px;color:var(--muted)}
.lockcard .btn{height:46px;justify-content:center;font-size:14px}
#lockerr{color:var(--red);font-size:13px;min-height:18px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* dialogs */
dialog{border:1px solid var(--line2);border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
dialog form{padding:22px}
dialog h3{font-size:19px;font-weight:600;margin-bottom:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide,.cbx{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld small{font-size:12px;color:var(--faint)}
.cbx{display:flex;gap:9px;align-items:center;font-size:14px}
.cbx input{width:auto;accent-color:var(--lime)}
.dlg-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
#search{width:min(600px,calc(100vw - 24px));top:10vh;margin-top:0}
#search .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--faint)}
#search .sh input{border:0;background:none;padding:0;font-size:16px}
#search .sh input:focus{outline:0}
#search .res{max-height:55vh;overflow-y:auto;padding:8px}
#search .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}

/* responsive */
@media (max-width:1240px){.ov{grid-template-columns:1fr}.ov>.aside{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px}}
@media (max-width:1000px){.r3{grid-template-columns:1fr 1fr}.r3>:last-child{grid-column:1/-1}}
@media (max-width:860px){
  .side{transform:translateX(-100%);width:268px!important;box-shadow:var(--shadow)}
  body.navopen .side{transform:none}
  body.navopen .askbar{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px);transition:opacity .2s,transform .2s}
  body.navopen .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  body.collapsed .side .lbl,body.collapsed .navsec,body.collapsed .logo b,body.collapsed .me .t,body.collapsed .nav .badge{display:revert}
  body.collapsed .nav{justify-content:flex-start}
  .app,body.collapsed .app{margin-left:0}
  .hamb{display:grid}
  .collapse-btn{display:none}
  .topbar{padding:env(safe-area-inset-top) 16px 0;height:calc(62px + env(safe-area-inset-top))}
  .searchbtn span,.searchbtn .kbd{display:none}
  .searchbtn{width:42px;padding:0;justify-content:center;flex:0 0 42px}
  .newlbl{display:none}
  main{padding:0 16px calc(120px + env(safe-area-inset-bottom))}
  .phead h1{font-size:28px}
  .r2,.r3,.catgrid{grid-template-columns:minmax(0,1fr)}
  .cat .ct{flex-wrap:wrap;row-gap:4px}.cat .ct .amt{margin-left:0;width:100%}
  .hero{grid-template-columns:1fr}
  .hero .stats{border-left:0;margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stat .v{font-size:18px}
  .big{font-size:28px}
  .fields{grid-template-columns:1fr}
  .scry.open{position:absolute;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));width:auto;z-index:5}
}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi .v{font-size:18px}.hero .stats{grid-template-columns:1fr 1fr}}
/* ---- Streak & rewards ---- */
.gpill{display:flex;align-items:center;gap:6px;height:42px;padding:0 11px 0 9px;border:1px solid var(--line);background:var(--card);border-radius:12px;font:800 15px/1 inherit;color:var(--text);cursor:pointer;flex:none}
.gpill .gfl{font-size:18px;filter:grayscale(1);opacity:.5;transition:filter .3s,opacity .3s}.gpill.on .gfl{filter:none;opacity:1}
.gpill .gring{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line2) 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.lime-t{color:var(--lime-text,var(--lime))}
.gxp{position:fixed;z-index:120;transform:translate(-50%,-50%);font-weight:800;font-size:17px;color:var(--lime-text,var(--lime));text-shadow:0 2px 12px rgba(0,0,0,.45);pointer-events:none;animation:gxp 1.25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes gxp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.gconf{position:fixed;inset:0;z-index:131;pointer-events:none}

<script>
'use strict';
/* ================= helpers ================= */
let KEY='selfstreak-anon',UIKEY='selfstreak-ui-anon';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const inr=n=>(n<0?'−':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const kfmt=v=>{const a=Math.abs(v),s=v<0?'−':'';return a>=1e5?s+'₹'+(+(a/1e5).toFixed(1))+'L':a>=1e3?s+'₹'+Math.round(a/1e3)+'k':s+'₹'+Math.round(a)};
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'—';
const sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const fmt=(d,o={day:'numeric',month:'short',year:'numeric'})=>d.toLocaleDateString('en-IN',o);
const ym=(y,m)=>`${y}-${pad(m+1)}`;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];

      const m=txt.match(/^([^\d]*?)(\d[\d,]*(?:\.\d+)?)([\s\S]*)$/);if(!m)return;
      const target=parseFloat(m[2].replace(/,/g,''));if(!isFinite(target)||target===0)return;
      const dec=(m[2].split('.')[1]||'').length,grp=m[2].includes(',')||target>=1000&&/₹/.test(txt),t0=performance.now(),D=950;
